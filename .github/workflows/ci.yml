name: product-ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: product-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  public-pr-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt, clippy
      - name: Install Linux build and verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils clang cmake file ripgrep shellcheck
      - name: Build and natively verify the GNU/Linux pilot archive
        env:
          MAVERICK_PILOT_TARGET: x86_64-unknown-linux-gnu
        run: |
          version="$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)"
          ./scripts/build-pilot.sh
          ./scripts/verify-pilot-artifact.sh \
            --archive "dist/maverick-${version}-pilot-${MAVERICK_PILOT_TARGET}.tar.gz" \
            --expected-version "$version" \
            --expected-revision "$GITHUB_SHA" \
            --expected-target "$MAVERICK_PILOT_TARGET" \
            --verification-level native
      - run: ./scripts/local-harness.sh
