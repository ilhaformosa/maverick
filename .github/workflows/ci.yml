name: product-ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: product-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    env:
      MAVERICK_EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Classify change scope
        id: scope
        env:
          MAVERICK_EVENT_NAME: ${{ github.event_name }}
          MAVERICK_BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          head_revision="$(git rev-parse HEAD)"
          if [[ "$head_revision" != "$MAVERICK_EXPECTED_REVISION" ]]; then
            echo "checked-out revision does not match the selected event revision" >&2
            exit 1
          fi

          docs_only=false
          scope_base=""
          candidate_base="$MAVERICK_BASE_REVISION"
          if [[ "$candidate_base" =~ ^[0-9a-f]{40}$ ]] &&
            [[ "$candidate_base" != "0000000000000000000000000000000000000000" ]] &&
            git cat-file -e "$candidate_base^{commit}" 2>/dev/null; then
            if [[ "$MAVERICK_EVENT_NAME" == "pull_request" ]]; then
              scope_base="$(git merge-base "$candidate_base" "$head_revision" 2>/dev/null || true)"
            elif [[ "$MAVERICK_EVENT_NAME" == "push" ]]; then
              scope_base="$candidate_base"
            fi
          fi

          if [[ "$scope_base" =~ ^[0-9a-f]{40}$ ]]; then
            docs_only=true
            changed_files=0
            while IFS= read -r -d '' change_status &&
              IFS= read -r -d '' change_path; do
              changed_files=$((changed_files + 1))
              case "$change_status" in
                A | M) ;;
                *) docs_only=false ;;
              esac
              case "$change_path" in
                AGENTS.md | README.md | STATUS.md | ROADMAP.md | CONFIG.md | \
                  THREAT_MODEL.md | SECURITY.md | \
                  docs/TRANSPORT_ARCHITECTURE.md | \
                  docs/TEST_SERVER_PREPARATION.md | \
                  docs/YOUTUBE_PLAYBACK_DIAGNOSIS.md | docs/archive/README.md) ;;
                *) docs_only=false ;;
              esac
              head_mode="$(git ls-tree "$head_revision" -- "$change_path" |
                awk 'NR == 1 { print $1 }')"
              [[ "$head_mode" == "100644" ]] || docs_only=false
              if [[ "$change_status" == "M" ]]; then
                base_mode="$(git ls-tree "$scope_base" -- "$change_path" |
                  awk 'NR == 1 { print $1 }')"
                [[ "$base_mode" == "100644" ]] || docs_only=false
              fi
            done < <(
              git diff --name-status --no-renames -z "$scope_base" "$head_revision"
            )
            [[ "$changed_files" -gt 0 ]] || docs_only=false
          fi

          printf 'docs_only=%s\n' "$docs_only" >>"$GITHUB_OUTPUT"
          printf 'base_revision=%s\n' "$scope_base" >>"$GITHUB_OUTPUT"
      - name: Check documentation-only change
        if: steps.scope.outputs.docs_only == 'true'
        env:
          MAVERICK_SCOPE_BASE: ${{ steps.scope.outputs.base_revision }}
        run: |
          set -euo pipefail
          head_revision="$(git rev-parse HEAD)"
          git diff --check "$MAVERICK_SCOPE_BASE" "$head_revision"
          active_docs=(
            AGENTS.md
            README.md
            STATUS.md
            ROADMAP.md
            CONFIG.md
            THREAT_MODEL.md
            SECURITY.md
            docs/TRANSPORT_ARCHITECTURE.md
            docs/TEST_SERVER_PREPARATION.md
            docs/YOUTUBE_PLAYBACK_DIAGNOSIS.md
            docs/archive/README.md
          )
          for doc_path in "${active_docs[@]}"; do
            [[ -f "$doc_path" && ! -L "$doc_path" ]] || {
              echo "missing or invalid active document" >&2
              exit 1
            }
          done
          privacy_pattern='/U''sers/|fi''le://|ssh''-rsa|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY'
          privacy_status=0
          grep -E -q "$privacy_pattern" "${active_docs[@]}" 2>/dev/null ||
            privacy_status=$?
          case "$privacy_status" in
            0)
              echo "active document contains a private path or key marker" >&2
              exit 1
              ;;
            1) ;;
            *)
              echo "unable to complete the active-document privacy scan" >&2
              exit 1
              ;;
          esac
          echo "documentation-only gate OK"

  linux-gate:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      MAVERICK_EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      MAVERICK_PILOT_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Identify Rust compiler for dependency cache
        id: compiler
        run: echo "key=$(rustc -vV | shasum -a 256 | cut -d ' ' -f 1)" >>"$GITHUB_OUTPUT"
      - name: Restore Rust dependencies and build tools
        id: rust-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          # Keep paths stable for v1 restoration. Cargo removes workspace outputs
          # before v2 saves; child globs alone do not filter recursive tar entries.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-cyclonedx
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            target
            crates/maverick-tests/fixtures/quiche-tls-auth/target
            !**/incremental/**
            !**/target/**/maverick*
            !**/target/**/libmaverick*
          key: product-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.key }}-cyclonedx059-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'scripts/build-pilot.sh') }}
          restore-keys: |
            product-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.key }}-cyclonedx059-
            product-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.key }}-cyclonedx059-
      - name: Inventory restored project outputs
        run: ./scripts/inspect-project-cache.sh capture "$RUNNER_TEMP/project-cache-before.json"
      - name: Check the supported rustls build and relay matrix
        run: ./scripts/check.sh rustls
      - name: Install Linux build and verification tools
        run: ./scripts/install-linux-tools.sh
      - name: Install the SBOM generator
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: Verify upstream H3 authentication and local TCP proxy
        run: ./scripts/check.sh h3
      - name: Evaluate the default-off quiche candidate
        run: ./scripts/check.sh quiche-candidate
      - name: Run the local product harness
        run: ./scripts/check.sh product
      - name: Build the exact-head GNU/Linux pilot archive
        id: pilot
        run: |
          set -euo pipefail
          actual_revision="$(git rev-parse HEAD)"
          if [[ "$actual_revision" != "$MAVERICK_EXPECTED_REVISION" ]]; then
            echo "checked-out revision does not match the selected event revision" >&2
            exit 1
          fi
          printf 'revision=%s\n' "$actual_revision" >>"$GITHUB_OUTPUT"
          ./scripts/build-pilot.sh
      - name: Statically verify the GNU/Linux pilot archive
        env:
          MAVERICK_PILOT_REVISION: ${{ steps.pilot.outputs.revision }}
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)"
          ./scripts/verify-pilot-artifact.sh \
            --archive "dist/maverick-${version}-pilot-${MAVERICK_PILOT_TARGET}.tar.gz" \
            --expected-version "$version" \
            --expected-revision "$MAVERICK_PILOT_REVISION" \
            --expected-target "$MAVERICK_PILOT_TARGET" \
            --verification-level static
      - name: Natively verify the GNU/Linux pilot archive
        env:
          MAVERICK_PILOT_REVISION: ${{ steps.pilot.outputs.revision }}
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)"
          ./scripts/verify-pilot-artifact.sh \
            --archive "dist/maverick-${version}-pilot-${MAVERICK_PILOT_TARGET}.tar.gz" \
            --expected-version "$version" \
            --expected-revision "$MAVERICK_PILOT_REVISION" \
            --expected-target "$MAVERICK_PILOT_TARGET" \
            --verification-level native
      - name: Generate and fully verify the GNU/Linux candidate SBOM
        env:
          MAVERICK_PILOT_REVISION: ${{ steps.pilot.outputs.revision }}
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)"
          sbom="dist/maverick-${version}-pilot-${MAVERICK_PILOT_TARGET}.cdx.json"
          ./scripts/generate-cyclonedx-sbom.sh \
            --expected-version "$version" \
            --expected-revision "$MAVERICK_PILOT_REVISION" \
            --target "$MAVERICK_PILOT_TARGET" \
            --output "$sbom"
          ./scripts/verify-cyclonedx-sbom.sh \
            --sbom "$sbom" \
            --expected-version "$version" \
            --expected-revision "$MAVERICK_PILOT_REVISION" \
            --expected-target "$MAVERICK_PILOT_TARGET" \
            --verification-level full \
            --source-root .
      - name: Exercise RC.2 upgrade and Beta.4 rollback on GNU/Linux
        env:
          GH_TOKEN: ${{ github.token }}
          MAVERICK_PILOT_REVISION: ${{ steps.pilot.outputs.revision }}
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)"
          previous_dir="$(mktemp -d "$RUNNER_TEMP/maverick-beta4.XXXXXX")"
          chmod 0700 "$previous_dir"
          # The download is the only network step; retry transient GitHub
          # errors. The drill verifies the archive against its checksum.
          for attempt in 1 2 3; do
            if gh release download v1.2.0-beta.4 --dir "$previous_dir" --clobber \
              --pattern "maverick-1.2.0-beta.4-pilot-${MAVERICK_PILOT_TARGET}.tar.gz" \
              --pattern "maverick-1.2.0-beta.4-pilot-${MAVERICK_PILOT_TARGET}.tar.gz.sha256"; then
              break
            fi
            [[ "$attempt" -lt 3 ]] || exit 1
            echo "::warning::Beta.4 download attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
          ./scripts/test-n-minus-one-release-drill.sh \
            --target "$MAVERICK_PILOT_TARGET" \
            --previous-archive "$previous_dir/maverick-1.2.0-beta.4-pilot-${MAVERICK_PILOT_TARGET}.tar.gz" \
            --previous-checksum "$previous_dir/maverick-1.2.0-beta.4-pilot-${MAVERICK_PILOT_TARGET}.tar.gz.sha256" \
            --candidate-archive "dist/maverick-${version}-pilot-${MAVERICK_PILOT_TARGET}.tar.gz" \
            --candidate-checksum "dist/maverick-${version}-pilot-${MAVERICK_PILOT_TARGET}.tar.gz.sha256" \
            --candidate-revision "$MAVERICK_PILOT_REVISION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rc-candidate-x86_64-unknown-linux-gnu
          path: |
            dist/maverick-1.2.0-rc.2-pilot-x86_64-unknown-linux-gnu.tar.gz
            dist/maverick-1.2.0-rc.2-pilot-x86_64-unknown-linux-gnu.tar.gz.sha256
            dist/maverick-1.2.0-rc.2-pilot-x86_64-unknown-linux-gnu.cdx.json
          if-no-files-found: error
          retention-days: 7
      - name: Compare project outputs after all checks
        run: |
          ./scripts/inspect-project-cache.sh capture "$RUNNER_TEMP/project-cache-after.json"
          ./scripts/inspect-project-cache.sh compare \
            "$RUNNER_TEMP/project-cache-before.json" "$RUNNER_TEMP/project-cache-after.json" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Prepare reusable dependency cache after verification
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          fixture=crates/maverick-tests/fixtures/quiche-tls-auth/Cargo.toml
          fixture_target="$(cargo metadata --locked --offline --no-deps --format-version 1 \
            --manifest-path "$fixture" | jq -r .target_directory)"
          for profile in dev release; do
            cargo clean --workspace --locked --offline --profile "$profile"
            cargo clean --workspace --locked --offline --profile "$profile" \
              --manifest-path "$fixture"
            # The fixture also builds libraries belonging to the root workspace.
            cargo clean --workspace --locked --offline --profile "$profile" \
              --target-dir "$fixture_target"
          done
          cargo clean --workspace --locked --offline --release \
            --target "$MAVERICK_PILOT_TARGET" \
            --target-dir "${MAVERICK_PILOT_BUILD_DIR:-$GITHUB_WORKSPACE/target/pilot-artifact}"
          ./scripts/inspect-project-cache.sh capture "$RUNNER_TEMP/project-cache-prepared.json"
          jq -e '.files | length == 0' "$RUNNER_TEMP/project-cache-prepared.json" >/dev/null
          echo 'Identified project executable outputs remaining before cache save: 0'
      - name: Save successful main dependency cache
        if: github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-cyclonedx
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            target
            crates/maverick-tests/fixtures/quiche-tls-auth/target
            !**/incremental/**
            !**/target/**/maverick*
            !**/target/**/libmaverick*
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Record cache result
        if: always()
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          CACHE_MATCHED: ${{ steps.rust-cache.outputs.cache-matched-key }}
        run: |
          restored=no
          [[ -z "$CACHE_MATCHED" ]] || restored=yes
          printf 'Rust dependency cache restored: `%s`; exact hit: `%s`\n' \
            "$restored" "$CACHE_HIT" >>"$GITHUB_STEP_SUMMARY"

  macos-sbom-gate:
    needs: scope
    if: ${{ needs.scope.outputs.docs_only != 'true' }}
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      MAVERICK_EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      MAVERICK_PILOT_TARGET: aarch64-apple-darwin
      MAVERICK_SBOM_TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - name: Identify Rust compiler for dependency cache
        id: compiler
        run: echo "key=$(rustc -vV | shasum -a 256 | cut -d ' ' -f 1)" >>"$GITHUB_OUTPUT"
      - name: Restore Rust dependencies and build tools
        id: rust-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          # Keep paths stable for v1 restoration. Cargo removes workspace outputs
          # before v2 saves; child globs alone do not filter recursive tar entries.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-cyclonedx
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            target
            crates/maverick-tests/fixtures/quiche-tls-auth/target
            !**/incremental/**
            !**/target/**/maverick*
            !**/target/**/libmaverick*
          key: product-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.key }}-cyclonedx059-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'scripts/build-pilot.sh') }}
          restore-keys: |
            product-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.key }}-cyclonedx059-
            product-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.key }}-cyclonedx059-
      - name: Inventory restored project outputs
        run: ./scripts/inspect-project-cache.sh capture "$RUNNER_TEMP/project-cache-before.json"
      - run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - run: cargo fetch --locked --target "$MAVERICK_SBOM_TARGET"
      - name: Verify upstream H3 authentication and local TCP proxy
        run: ./scripts/check.sh h3
      - name: Evaluate the default-off quiche candidate
        run: ./scripts/check.sh quiche-candidate
      - name: Build and verify exact-head macOS candidate artifacts
        run: |
          set -euo pipefail
          actual_revision="$(git rev-parse HEAD)"
          if [[ "$actual_revision" != "$MAVERICK_EXPECTED_REVISION" ]]; then
            echo "checked-out revision does not match the selected event revision" >&2
            exit 1
          fi
          version="$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)"
          archive="dist/maverick-${version}-pilot-${MAVERICK_SBOM_TARGET}.tar.gz"
          ./scripts/build-pilot.sh
          ./scripts/verify-pilot-artifact.sh \
            --archive "$archive" \
            --expected-version "$version" \
            --expected-revision "$actual_revision" \
            --expected-target "$MAVERICK_SBOM_TARGET" \
            --verification-level native
          sbom="dist/maverick-${version}-pilot-${MAVERICK_SBOM_TARGET}.cdx.json"
          ./scripts/generate-cyclonedx-sbom.sh \
            --expected-version "$version" \
            --expected-revision "$actual_revision" \
            --target "$MAVERICK_SBOM_TARGET" \
            --output "$sbom"
          ./scripts/verify-cyclonedx-sbom.sh \
            --sbom "$sbom" \
            --expected-version "$version" \
            --expected-revision "$actual_revision" \
            --expected-target "$MAVERICK_SBOM_TARGET" \
            --verification-level full \
            --source-root .
      - name: Exercise RC.2 upgrade and Beta.4 rollback on macOS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual_revision="$(git rev-parse HEAD)"
          version="$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)"
          previous_dir="$(mktemp -d "$RUNNER_TEMP/maverick-beta4.XXXXXX")"
          chmod 0700 "$previous_dir"
          # The download is the only network step; retry transient GitHub
          # errors. The drill verifies the archive against its checksum.
          for attempt in 1 2 3; do
            if gh release download v1.2.0-beta.4 --dir "$previous_dir" --clobber \
              --pattern "maverick-1.2.0-beta.4-pilot-${MAVERICK_SBOM_TARGET}.tar.gz" \
              --pattern "maverick-1.2.0-beta.4-pilot-${MAVERICK_SBOM_TARGET}.tar.gz.sha256"; then
              break
            fi
            [[ "$attempt" -lt 3 ]] || exit 1
            echo "::warning::Beta.4 download attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
          ./scripts/test-n-minus-one-release-drill.sh \
            --target "$MAVERICK_SBOM_TARGET" \
            --previous-archive "$previous_dir/maverick-1.2.0-beta.4-pilot-${MAVERICK_SBOM_TARGET}.tar.gz" \
            --previous-checksum "$previous_dir/maverick-1.2.0-beta.4-pilot-${MAVERICK_SBOM_TARGET}.tar.gz.sha256" \
            --candidate-archive "dist/maverick-${version}-pilot-${MAVERICK_SBOM_TARGET}.tar.gz" \
            --candidate-checksum "dist/maverick-${version}-pilot-${MAVERICK_SBOM_TARGET}.tar.gz.sha256" \
            --candidate-revision "$actual_revision"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rc-candidate-aarch64-apple-darwin
          path: |
            dist/maverick-1.2.0-rc.2-pilot-aarch64-apple-darwin.tar.gz
            dist/maverick-1.2.0-rc.2-pilot-aarch64-apple-darwin.tar.gz.sha256
            dist/maverick-1.2.0-rc.2-pilot-aarch64-apple-darwin.cdx.json
          if-no-files-found: error
          retention-days: 7
      - name: Compare project outputs after all checks
        run: |
          ./scripts/inspect-project-cache.sh capture "$RUNNER_TEMP/project-cache-after.json"
          ./scripts/inspect-project-cache.sh compare \
            "$RUNNER_TEMP/project-cache-before.json" "$RUNNER_TEMP/project-cache-after.json" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Prepare reusable dependency cache after verification
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          fixture=crates/maverick-tests/fixtures/quiche-tls-auth/Cargo.toml
          fixture_target="$(cargo metadata --locked --offline --no-deps --format-version 1 \
            --manifest-path "$fixture" | jq -r .target_directory)"
          for profile in dev release; do
            cargo clean --workspace --locked --offline --profile "$profile"
            cargo clean --workspace --locked --offline --profile "$profile" \
              --manifest-path "$fixture"
            # The fixture also builds libraries belonging to the root workspace.
            cargo clean --workspace --locked --offline --profile "$profile" \
              --target-dir "$fixture_target"
          done
          cargo clean --workspace --locked --offline --release \
            --target "$MAVERICK_PILOT_TARGET" \
            --target-dir "${MAVERICK_PILOT_BUILD_DIR:-$GITHUB_WORKSPACE/target/pilot-artifact}"
          ./scripts/inspect-project-cache.sh capture "$RUNNER_TEMP/project-cache-prepared.json"
          jq -e '.files | length == 0' "$RUNNER_TEMP/project-cache-prepared.json" >/dev/null
          echo 'Identified project executable outputs remaining before cache save: 0'
      - name: Save successful main dependency cache
        if: github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-cyclonedx
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            target
            crates/maverick-tests/fixtures/quiche-tls-auth/target
            !**/incremental/**
            !**/target/**/maverick*
            !**/target/**/libmaverick*
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Record cache result
        if: always()
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          CACHE_MATCHED: ${{ steps.rust-cache.outputs.cache-matched-key }}
        run: |
          restored=no
          [[ -z "$CACHE_MATCHED" ]] || restored=yes
          printf 'Rust dependency cache restored: `%s`; exact hit: `%s`\n' \
            "$restored" "$CACHE_HIT" >>"$GITHUB_STEP_SUMMARY"

  public-pr-gate:
    if: always()
    needs: [scope, linux-gate, macos-sbom-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all applicable checks
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
          LINUX_RESULT: ${{ needs.linux-gate.result }}
          MACOS_RESULT: ${{ needs.macos-sbom-gate.result }}
        run: |
          set -euo pipefail
          [[ "$SCOPE_RESULT" == success ]] || exit 1
          case "$DOCS_ONLY" in
            true)
              [[ "$LINUX_RESULT" == skipped && "$MACOS_RESULT" == skipped ]] || exit 1
              ;;
            false)
              [[ "$LINUX_RESULT" == success && "$MACOS_RESULT" == success ]] || exit 1
              ;;
            *) exit 1 ;;
          esac
          printf 'Scope: %s; Linux: %s; macOS: %s\n' \
            "$SCOPE_RESULT" "$LINUX_RESULT" "$MACOS_RESULT" >>"$GITHUB_STEP_SUMMARY"
