name: product-ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: product-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  public-pr-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    env:
      MAVERICK_EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      MAVERICK_PILOT_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Classify change scope
        id: scope
        env:
          MAVERICK_EVENT_NAME: ${{ github.event_name }}
          MAVERICK_BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          head_revision="$(git rev-parse HEAD)"
          if [[ "$head_revision" != "$MAVERICK_EXPECTED_REVISION" ]]; then
            echo "checked-out revision does not match the selected event revision" >&2
            exit 1
          fi

          docs_only=false
          scope_base=""
          candidate_base="$MAVERICK_BASE_REVISION"
          if [[ "$candidate_base" =~ ^[0-9a-f]{40}$ ]] &&
            [[ "$candidate_base" != "0000000000000000000000000000000000000000" ]] &&
            git cat-file -e "$candidate_base^{commit}" 2>/dev/null; then
            if [[ "$MAVERICK_EVENT_NAME" == "pull_request" ]]; then
              scope_base="$(git merge-base "$candidate_base" "$head_revision" 2>/dev/null || true)"
            elif [[ "$MAVERICK_EVENT_NAME" == "push" ]]; then
              scope_base="$candidate_base"
            fi
          fi

          if [[ "$scope_base" =~ ^[0-9a-f]{40}$ ]]; then
            docs_only=true
            changed_files=0
            while IFS= read -r -d '' change_status &&
              IFS= read -r -d '' change_path; do
              changed_files=$((changed_files + 1))
              case "$change_status" in
                A | M) ;;
                *) docs_only=false ;;
              esac
              case "$change_path" in
                AGENTS.md | README.md | STATUS.md | ROADMAP.md | CONFIG.md | \
                  THREAT_MODEL.md | SECURITY.md | \
                  docs/TRANSPORT_ARCHITECTURE.md | \
                  docs/TEST_SERVER_PREPARATION.md | \
                  docs/YOUTUBE_PLAYBACK_DIAGNOSIS.md | docs/archive/README.md) ;;
                *) docs_only=false ;;
              esac
              head_mode="$(git ls-tree "$head_revision" -- "$change_path" |
                awk 'NR == 1 { print $1 }')"
              [[ "$head_mode" == "100644" ]] || docs_only=false
              if [[ "$change_status" == "M" ]]; then
                base_mode="$(git ls-tree "$scope_base" -- "$change_path" |
                  awk 'NR == 1 { print $1 }')"
                [[ "$base_mode" == "100644" ]] || docs_only=false
              fi
            done < <(
              git diff --name-status --no-renames -z "$scope_base" "$head_revision"
            )
            [[ "$changed_files" -gt 0 ]] || docs_only=false
          fi

          printf 'docs_only=%s\n' "$docs_only" >>"$GITHUB_OUTPUT"
          printf 'base_revision=%s\n' "$scope_base" >>"$GITHUB_OUTPUT"
      - name: Check documentation-only change
        if: steps.scope.outputs.docs_only == 'true'
        env:
          MAVERICK_SCOPE_BASE: ${{ steps.scope.outputs.base_revision }}
        run: |
          set -euo pipefail
          head_revision="$(git rev-parse HEAD)"
          git diff --check "$MAVERICK_SCOPE_BASE" "$head_revision"
          active_docs=(
            AGENTS.md
            README.md
            STATUS.md
            ROADMAP.md
            CONFIG.md
            THREAT_MODEL.md
            SECURITY.md
            docs/TRANSPORT_ARCHITECTURE.md
            docs/TEST_SERVER_PREPARATION.md
            docs/YOUTUBE_PLAYBACK_DIAGNOSIS.md
            docs/archive/README.md
          )
          for doc_path in "${active_docs[@]}"; do
            [[ -f "$doc_path" && ! -L "$doc_path" ]] || {
              echo "missing or invalid active document" >&2
              exit 1
            }
          done
          privacy_pattern='/U''sers/|fi''le://|ssh''-rsa|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY'
          privacy_status=0
          grep -E -q "$privacy_pattern" "${active_docs[@]}" 2>/dev/null ||
            privacy_status=$?
          case "$privacy_status" in
            0)
              echo "active document contains a private path or key marker" >&2
              exit 1
              ;;
            1) ;;
            *)
              echo "unable to complete the active-document privacy scan" >&2
              exit 1
              ;;
          esac
          echo "documentation-only gate OK"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        if: steps.scope.outputs.docs_only != 'true'
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Check the supported no-default build
        if: steps.scope.outputs.docs_only != 'true'
        run: >-
          cargo check --locked
          -p maverick-cli -p maverick-sdk -p maverick-tests
          --all-targets --no-default-features
      - name: Test config-v1 H3 retirement and the H2 fallback oracle
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          retirement_tests="$(cargo test --locked -p maverick-tests --no-default-features \
            --test tcp_relay -- --list)"
          grep -Fqx 'server_rejects_retired_v1_h3_config_with_fixed_error: test' \
            <<<"${retirement_tests}"
          grep -Fqx 'bad_auth_reverse_proxy_fallback_preserves_path_query_and_available_body: test' \
            <<<"${retirement_tests}"
          cargo test --locked -p maverick-tests --no-default-features \
            --test tcp_relay server_rejects_retired_v1_h3_config_with_fixed_error -- --exact
          cargo test --locked -p maverick-tests --no-default-features \
            --test tcp_relay bad_auth_reverse_proxy_fallback_preserves_path_query_and_available_body -- --exact
      - name: Install Linux build and verification tools
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils clang cmake file ripgrep shellcheck
      - name: Evaluate the default-off quiche candidate
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          graph="$(cargo tree --locked -p maverick-tests \
            --no-default-features --features browser-tls,quiche-candidate \
            --edges normal,build --prefix none)"
          [[ "$(grep -Ecx 'quiche v0\.29\.3' <<<"$graph")" -eq 1 ]]
          [[ "$(grep -Ecx 'boring v5\.1\.0' <<<"$graph")" -eq 1 ]]
          [[ "$(grep -Ecx 'boring-sys v5\.1\.0' <<<"$graph")" -eq 1 ]]
          ! grep -Eq '^boring(-sys)? v4\.' <<<"$graph"
          metadata="$(cargo metadata --locked --format-version 1 \
            --no-default-features \
            --features maverick-tests/browser-tls,maverick-tests/quiche-candidate)"
          log_id='registry+https://github.com/rust-lang/crates.io-index#log@0.4.33'
          jq -e --arg log_id "$log_id" '
            (.packages | map(select(.name == "log")) | length == 1) and
            (.packages | map(select(
              .name == "log" and .version == "0.4.33" and
              .source == "registry+https://github.com/rust-lang/crates.io-index" and
              .id == $log_id
            )) | length == 1) and
            (.resolve.nodes | map(select(.id == $log_id)) | length == 1) and
            ((.resolve.nodes[] | select(.id == $log_id) | .features |
              index("max_level_debug")) != null) and
            ([.resolve.nodes[] | select(.id == $log_id) | .features[] |
              select(contains("trace"))] | length == 0)
          ' <<<"$metadata" >/dev/null
          quiche_manifest="$(jq -er '
            [.packages[] | select(.name == "quiche")] |
            if length == 1 and .[0].version == "0.29.3" and
              .[0].source == "registry+https://github.com/rust-lang/crates.io-index" and
              .[0].id == "registry+https://github.com/rust-lang/crates.io-index#quiche@0.29.3"
            then .[0].manifest_path
            else error("quiche package identity mismatch")
            end
          ' <<<"$metadata")"
          quiche_source="${quiche_manifest%/Cargo.toml}"
          repository_root="$(git rev-parse --show-toplevel)"
          [[ "$quiche_source" != "$quiche_manifest" ]]
          case "$quiche_source/" in
            "$repository_root"/*) exit 1 ;;
          esac
          [[ -d "$quiche_source/src/h3" && ! -L "$quiche_source" ]]
          [[ -f "$quiche_manifest" && ! -L "$quiche_manifest" ]]
          [[ "$(shasum -a 256 "$quiche_manifest" | awk '{print $1}')" == \
            '01434a970c9661367b730bb907d461985d2de61e521386ec79bb91a17b24ffd0' ]]
          features="$(cargo tree --locked -p maverick-tests \
            --no-default-features --features browser-tls,quiche-candidate \
            -e features -i quiche@0.29.3 --prefix none)"
          [[ "$(grep -Ecx 'quiche v0\.29\.3' <<<"$features")" -eq 1 ]]
          ! grep -Fq 'quiche feature' <<<"$features"
          expected_h3_files="$(printf '%s\n' \
            src/h3/ffi.rs \
            src/h3/frame.rs \
            src/h3/mod.rs \
            src/h3/qpack/decoder.rs \
            src/h3/qpack/encoder.rs \
            src/h3/qpack/mod.rs \
            src/h3/qpack/static_table.rs \
            src/h3/stream.rs)"
          actual_h3_files="$(find "$quiche_source/src/h3" -type f \
            -name '*.rs' -print | sed "s#^$quiche_source/##" | LC_ALL=C sort)"
          [[ "$actual_h3_files" == "$expected_h3_files" ]]
          expected_h3_hashes="$(printf '%s\n' \
            'd9e96d7a133b985d345f74671e75abe543b63014e45da7ea18c6f183aaae10c1  src/h3/ffi.rs' \
            'e15907dac76afc70ce3fdee890556a92fb94e14f39220194b44031f3a8d0a410  src/h3/frame.rs' \
            '9e00d00e09524f785e16793633bcf1f936ce13c5b8e5a73898fc65e7636b15f6  src/h3/mod.rs' \
            'e3ab2550117decde3f5de1c723ca59d81f07f0f91a3d07567acae59d512f9b1d  src/h3/qpack/decoder.rs' \
            '068f9d63efc7732887e9123feeb9f1d93471be50b53f1ae656f562f4f681161f  src/h3/qpack/encoder.rs' \
            'b2037b5485b510d6d1954e41b9ae9312ddae47120f4582b4e9630350bf9ff3a3  src/h3/qpack/mod.rs' \
            'c907b067cb1b41f68c5f15f777afcf2149ffa0a00b869a5eeabb5baf4c64e9ce  src/h3/qpack/static_table.rs' \
            'ec992ebe411261b2eb51717fc8e0a92bee928328ff830b5d7be40b86faa9b19e  src/h3/stream.rs')"
          actual_h3_hashes=""
          while IFS= read -r h3_file; do
            h3_hash="$(shasum -a 256 "$quiche_source/$h3_file" | awk '{print $1}')"
            actual_h3_hashes+="${h3_hash}  ${h3_file}"$'\n'
          done <<<"$actual_h3_files"
          actual_h3_hashes="${actual_h3_hashes%$'\n'}"
          [[ "$actual_h3_hashes" == "$expected_h3_hashes" ]]
          expected_trace_counts="$(printf '%s\n' \
            '0  src/h3/ffi.rs' \
            '0  src/h3/frame.rs' \
            '15  src/h3/mod.rs' \
            '6  src/h3/qpack/decoder.rs' \
            '0  src/h3/qpack/encoder.rs' \
            '0  src/h3/qpack/mod.rs' \
            '0  src/h3/qpack/static_table.rs' \
            '2  src/h3/stream.rs')"
          actual_trace_counts=""
          trace_call_count=0
          while IFS= read -r h3_file; do
            h3_trace_count="$(grep -E -c \
              '(^|[^[:alnum:]_])trace!\(' "$quiche_source/$h3_file" || true)"
            trace_call_count=$((trace_call_count + h3_trace_count))
            actual_trace_counts+="${h3_trace_count}  ${h3_file}"$'\n'
          done <<<"$actual_h3_files"
          actual_trace_counts="${actual_trace_counts%$'\n'}"
          [[ "$actual_trace_counts" == "$expected_trace_counts" ]]
          [[ "$trace_call_count" -eq 23 ]]
          default_cli="$(cargo tree --locked -p maverick-cli --prefix none)"
          no_default_cli="$(cargo tree --locked -p maverick-cli \
            --no-default-features --prefix none)"
          ! grep -Eq '^quiche v' <<<"$default_cli"
          ! grep -Eq '^quiche v' <<<"$no_default_cli"
          cargo test --locked -p maverick-tests --no-default-features \
            --features browser-tls,quiche-candidate \
            --test quiche_candidate -- --test-threads=1
      - name: Build the exact-head GNU/Linux pilot archive
        id: pilot
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          actual_revision="$(git rev-parse HEAD)"
          if [[ "$actual_revision" != "$MAVERICK_EXPECTED_REVISION" ]]; then
            echo "checked-out revision does not match the selected event revision" >&2
            exit 1
          fi
          printf 'revision=%s\n' "$actual_revision" >>"$GITHUB_OUTPUT"
          ./scripts/build-pilot.sh
      - name: Statically verify the GNU/Linux pilot archive
        if: steps.scope.outputs.docs_only != 'true'
        env:
          MAVERICK_PILOT_REVISION: ${{ steps.pilot.outputs.revision }}
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)"
          ./scripts/verify-pilot-artifact.sh \
            --archive "dist/maverick-${version}-pilot-${MAVERICK_PILOT_TARGET}.tar.gz" \
            --expected-version "$version" \
            --expected-revision "$MAVERICK_PILOT_REVISION" \
            --expected-target "$MAVERICK_PILOT_TARGET" \
            --verification-level static
      - name: Natively verify the GNU/Linux pilot archive
        if: steps.scope.outputs.docs_only != 'true'
        env:
          MAVERICK_PILOT_REVISION: ${{ steps.pilot.outputs.revision }}
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)"
          ./scripts/verify-pilot-artifact.sh \
            --archive "dist/maverick-${version}-pilot-${MAVERICK_PILOT_TARGET}.tar.gz" \
            --expected-version "$version" \
            --expected-revision "$MAVERICK_PILOT_REVISION" \
            --expected-target "$MAVERICK_PILOT_TARGET" \
            --verification-level native
      - name: Run the local product harness
        if: steps.scope.outputs.docs_only != 'true'
        run: ./scripts/local-harness.sh

  macos-sbom-gate:
    needs: public-pr-gate
    if: ${{ needs.public-pr-gate.outputs.docs_only != 'true' }}
    runs-on: macos-14
    timeout-minutes: 20
    env:
      MAVERICK_EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      MAVERICK_SBOM_TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.1
      - run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - run: cargo fetch --locked --target "$MAVERICK_SBOM_TARGET"
      - name: Evaluate the default-off quiche candidate
        run: |
          set -euo pipefail
          graph="$(cargo tree --locked -p maverick-tests \
            --no-default-features --features browser-tls,quiche-candidate \
            --target "$MAVERICK_SBOM_TARGET" \
            --edges normal,build --prefix none)"
          [[ "$(grep -Ecx 'quiche v0\.29\.3' <<<"$graph")" -eq 1 ]]
          [[ "$(grep -Ecx 'boring v5\.1\.0' <<<"$graph")" -eq 1 ]]
          [[ "$(grep -Ecx 'boring-sys v5\.1\.0' <<<"$graph")" -eq 1 ]]
          ! grep -Eq '^boring(-sys)? v4\.' <<<"$graph"
          metadata="$(cargo metadata --locked --format-version 1 \
            --no-default-features \
            --features maverick-tests/browser-tls,maverick-tests/quiche-candidate)"
          log_id='registry+https://github.com/rust-lang/crates.io-index#log@0.4.33'
          jq -e --arg log_id "$log_id" '
            (.packages | map(select(.name == "log")) | length == 1) and
            (.packages | map(select(
              .name == "log" and .version == "0.4.33" and
              .source == "registry+https://github.com/rust-lang/crates.io-index" and
              .id == $log_id
            )) | length == 1) and
            (.resolve.nodes | map(select(.id == $log_id)) | length == 1) and
            ((.resolve.nodes[] | select(.id == $log_id) | .features |
              index("max_level_debug")) != null) and
            ([.resolve.nodes[] | select(.id == $log_id) | .features[] |
              select(contains("trace"))] | length == 0)
          ' <<<"$metadata" >/dev/null
          quiche_manifest="$(jq -er '
            [.packages[] | select(.name == "quiche")] |
            if length == 1 and .[0].version == "0.29.3" and
              .[0].source == "registry+https://github.com/rust-lang/crates.io-index" and
              .[0].id == "registry+https://github.com/rust-lang/crates.io-index#quiche@0.29.3"
            then .[0].manifest_path
            else error("quiche package identity mismatch")
            end
          ' <<<"$metadata")"
          quiche_source="${quiche_manifest%/Cargo.toml}"
          repository_root="$(git rev-parse --show-toplevel)"
          [[ "$quiche_source" != "$quiche_manifest" ]]
          case "$quiche_source/" in
            "$repository_root"/*) exit 1 ;;
          esac
          [[ -d "$quiche_source/src/h3" && ! -L "$quiche_source" ]]
          [[ -f "$quiche_manifest" && ! -L "$quiche_manifest" ]]
          [[ "$(shasum -a 256 "$quiche_manifest" | awk '{print $1}')" == \
            '01434a970c9661367b730bb907d461985d2de61e521386ec79bb91a17b24ffd0' ]]
          features="$(cargo tree --locked -p maverick-tests \
            --no-default-features --features browser-tls,quiche-candidate \
            --target "$MAVERICK_SBOM_TARGET" \
            -e features -i quiche@0.29.3 --prefix none)"
          [[ "$(grep -Ecx 'quiche v0\.29\.3' <<<"$features")" -eq 1 ]]
          ! grep -Fq 'quiche feature' <<<"$features"
          expected_h3_files="$(printf '%s\n' \
            src/h3/ffi.rs \
            src/h3/frame.rs \
            src/h3/mod.rs \
            src/h3/qpack/decoder.rs \
            src/h3/qpack/encoder.rs \
            src/h3/qpack/mod.rs \
            src/h3/qpack/static_table.rs \
            src/h3/stream.rs)"
          actual_h3_files="$(find "$quiche_source/src/h3" -type f \
            -name '*.rs' -print | sed "s#^$quiche_source/##" | LC_ALL=C sort)"
          [[ "$actual_h3_files" == "$expected_h3_files" ]]
          expected_h3_hashes="$(printf '%s\n' \
            'd9e96d7a133b985d345f74671e75abe543b63014e45da7ea18c6f183aaae10c1  src/h3/ffi.rs' \
            'e15907dac76afc70ce3fdee890556a92fb94e14f39220194b44031f3a8d0a410  src/h3/frame.rs' \
            '9e00d00e09524f785e16793633bcf1f936ce13c5b8e5a73898fc65e7636b15f6  src/h3/mod.rs' \
            'e3ab2550117decde3f5de1c723ca59d81f07f0f91a3d07567acae59d512f9b1d  src/h3/qpack/decoder.rs' \
            '068f9d63efc7732887e9123feeb9f1d93471be50b53f1ae656f562f4f681161f  src/h3/qpack/encoder.rs' \
            'b2037b5485b510d6d1954e41b9ae9312ddae47120f4582b4e9630350bf9ff3a3  src/h3/qpack/mod.rs' \
            'c907b067cb1b41f68c5f15f777afcf2149ffa0a00b869a5eeabb5baf4c64e9ce  src/h3/qpack/static_table.rs' \
            'ec992ebe411261b2eb51717fc8e0a92bee928328ff830b5d7be40b86faa9b19e  src/h3/stream.rs')"
          actual_h3_hashes=""
          while IFS= read -r h3_file; do
            h3_hash="$(shasum -a 256 "$quiche_source/$h3_file" | awk '{print $1}')"
            actual_h3_hashes+="${h3_hash}  ${h3_file}"$'\n'
          done <<<"$actual_h3_files"
          actual_h3_hashes="${actual_h3_hashes%$'\n'}"
          [[ "$actual_h3_hashes" == "$expected_h3_hashes" ]]
          expected_trace_counts="$(printf '%s\n' \
            '0  src/h3/ffi.rs' \
            '0  src/h3/frame.rs' \
            '15  src/h3/mod.rs' \
            '6  src/h3/qpack/decoder.rs' \
            '0  src/h3/qpack/encoder.rs' \
            '0  src/h3/qpack/mod.rs' \
            '0  src/h3/qpack/static_table.rs' \
            '2  src/h3/stream.rs')"
          actual_trace_counts=""
          trace_call_count=0
          while IFS= read -r h3_file; do
            h3_trace_count="$(grep -E -c \
              '(^|[^[:alnum:]_])trace!\(' "$quiche_source/$h3_file" || true)"
            trace_call_count=$((trace_call_count + h3_trace_count))
            actual_trace_counts+="${h3_trace_count}  ${h3_file}"$'\n'
          done <<<"$actual_h3_files"
          actual_trace_counts="${actual_trace_counts%$'\n'}"
          [[ "$actual_trace_counts" == "$expected_trace_counts" ]]
          [[ "$trace_call_count" -eq 23 ]]
          default_cli="$(cargo tree --locked -p maverick-cli \
            --target "$MAVERICK_SBOM_TARGET" --prefix none)"
          no_default_cli="$(cargo tree --locked -p maverick-cli \
            --no-default-features --target "$MAVERICK_SBOM_TARGET" \
            --prefix none)"
          ! grep -Eq '^quiche v' <<<"$default_cli"
          ! grep -Eq '^quiche v' <<<"$no_default_cli"
          cargo test --locked -p maverick-tests --no-default-features \
            --features browser-tls,quiche-candidate \
            --test quiche_candidate -- --test-threads=1
      - name: Generate and fully verify the exact-head macOS SBOM
        run: |
          set -euo pipefail
          actual_revision="$(git rev-parse HEAD)"
          if [[ "$actual_revision" != "$MAVERICK_EXPECTED_REVISION" ]]; then
            echo "checked-out revision does not match the selected event revision" >&2
            exit 1
          fi
          version="$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)"
          private_output=""
          cleanup() {
            case "$private_output" in
              "$RUNNER_TEMP"/maverick-sbom-ci.*)
                [[ ! -d "$private_output" ]] ||
                  find "$private_output" -depth -delete >/dev/null 2>&1 || true
                ;;
            esac
          }
          trap cleanup EXIT
          private_output="$(
            mktemp -d "$RUNNER_TEMP/maverick-sbom-ci.XXXXXX" 2>/dev/null
          )" || {
            echo "macOS SBOM gate failed" >&2
            exit 1
          }
          chmod 0700 "$private_output"
          sbom="$private_output/maverick-${version}-pilot-${MAVERICK_SBOM_TARGET}.cdx.json"
          ./scripts/generate-cyclonedx-sbom.sh \
            --expected-version "$version" \
            --expected-revision "$actual_revision" \
            --target "$MAVERICK_SBOM_TARGET" \
            --output "$sbom"
          ./scripts/verify-cyclonedx-sbom.sh \
            --sbom "$sbom" \
            --expected-version "$version" \
            --expected-revision "$actual_revision" \
            --expected-target "$MAVERICK_SBOM_TARGET" \
            --verification-level full \
            --source-root .
