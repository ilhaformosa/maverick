name: product-ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: product-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  public-pr-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    env:
      MAVERICK_EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      MAVERICK_PILOT_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Classify change scope
        id: scope
        env:
          MAVERICK_EVENT_NAME: ${{ github.event_name }}
          MAVERICK_BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          head_revision="$(git rev-parse HEAD)"
          if [[ "$head_revision" != "$MAVERICK_EXPECTED_REVISION" ]]; then
            echo "checked-out revision does not match the selected event revision" >&2
            exit 1
          fi

          docs_only=false
          scope_base=""
          candidate_base="$MAVERICK_BASE_REVISION"
          if [[ "$candidate_base" =~ ^[0-9a-f]{40}$ ]] &&
            [[ "$candidate_base" != "0000000000000000000000000000000000000000" ]] &&
            git cat-file -e "$candidate_base^{commit}" 2>/dev/null; then
            if [[ "$MAVERICK_EVENT_NAME" == "pull_request" ]]; then
              scope_base="$(git merge-base "$candidate_base" "$head_revision" 2>/dev/null || true)"
            elif [[ "$MAVERICK_EVENT_NAME" == "push" ]]; then
              scope_base="$candidate_base"
            fi
          fi

          if [[ "$scope_base" =~ ^[0-9a-f]{40}$ ]]; then
            docs_only=true
            changed_files=0
            while IFS= read -r -d '' change_status &&
              IFS= read -r -d '' change_path; do
              changed_files=$((changed_files + 1))
              case "$change_status" in
                A | M) ;;
                *) docs_only=false ;;
              esac
              case "$change_path" in
                AGENTS.md | README.md | STATUS.md | ROADMAP.md | CONFIG.md | \
                  THREAT_MODEL.md | SECURITY.md | \
                  docs/TRANSPORT_ARCHITECTURE.md | \
                  docs/TEST_SERVER_PREPARATION.md | \
                  docs/YOUTUBE_PLAYBACK_DIAGNOSIS.md | docs/archive/README.md) ;;
                *) docs_only=false ;;
              esac
              head_mode="$(git ls-tree "$head_revision" -- "$change_path" |
                awk 'NR == 1 { print $1 }')"
              [[ "$head_mode" == "100644" ]] || docs_only=false
              if [[ "$change_status" == "M" ]]; then
                base_mode="$(git ls-tree "$scope_base" -- "$change_path" |
                  awk 'NR == 1 { print $1 }')"
                [[ "$base_mode" == "100644" ]] || docs_only=false
              fi
            done < <(
              git diff --name-status --no-renames -z "$scope_base" "$head_revision"
            )
            [[ "$changed_files" -gt 0 ]] || docs_only=false
          fi

          printf 'docs_only=%s\n' "$docs_only" >>"$GITHUB_OUTPUT"
          printf 'base_revision=%s\n' "$scope_base" >>"$GITHUB_OUTPUT"
      - name: Check documentation-only change
        if: steps.scope.outputs.docs_only == 'true'
        env:
          MAVERICK_SCOPE_BASE: ${{ steps.scope.outputs.base_revision }}
        run: |
          set -euo pipefail
          head_revision="$(git rev-parse HEAD)"
          git diff --check "$MAVERICK_SCOPE_BASE" "$head_revision"
          active_docs=(
            AGENTS.md
            README.md
            STATUS.md
            ROADMAP.md
            CONFIG.md
            THREAT_MODEL.md
            SECURITY.md
            docs/TRANSPORT_ARCHITECTURE.md
            docs/TEST_SERVER_PREPARATION.md
            docs/YOUTUBE_PLAYBACK_DIAGNOSIS.md
            docs/archive/README.md
          )
          for doc_path in "${active_docs[@]}"; do
            [[ -f "$doc_path" && ! -L "$doc_path" ]] || {
              echo "missing or invalid active document" >&2
              exit 1
            }
          done
          privacy_pattern='/U''sers/|fi''le://|ssh''-rsa|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY'
          privacy_status=0
          grep -E -q "$privacy_pattern" "${active_docs[@]}" 2>/dev/null ||
            privacy_status=$?
          case "$privacy_status" in
            0)
              echo "active document contains a private path or key marker" >&2
              exit 1
              ;;
            1) ;;
            *)
              echo "unable to complete the active-document privacy scan" >&2
              exit 1
              ;;
          esac
          echo "documentation-only gate OK"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        if: steps.scope.outputs.docs_only != 'true'
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Check the supported no-default build
        if: steps.scope.outputs.docs_only != 'true'
        run: >-
          cargo check --locked
          -p maverick-cli -p maverick-sdk -p maverick-tests
          --all-targets --no-default-features
      - name: Test config-v1 H3 retirement and the H2 fallback oracle
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          retirement_tests="$(cargo test --locked -p maverick-tests --no-default-features \
            --test tcp_relay -- --list)"
          grep -Fqx 'server_rejects_retired_v1_h3_config_with_fixed_error: test' \
            <<<"${retirement_tests}"
          grep -Fqx 'bad_auth_reverse_proxy_fallback_preserves_path_query_and_available_body: test' \
            <<<"${retirement_tests}"
          cargo test --locked -p maverick-tests --no-default-features \
            --test tcp_relay server_rejects_retired_v1_h3_config_with_fixed_error -- --exact
          cargo test --locked -p maverick-tests --no-default-features \
            --test tcp_relay bad_auth_reverse_proxy_fallback_preserves_path_query_and_available_body -- --exact
      - name: Install Linux build and verification tools
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils clang cmake file ripgrep shellcheck
      - name: Install the SBOM generator
        if: steps.scope.outputs.docs_only != 'true'
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: Evaluate the default-off quiche candidate
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          graph="$(cargo tree --locked -p maverick-tests \
            --no-default-features --features browser-tls,quiche-candidate \
            --edges normal,build --prefix none)"
          [[ "$(grep -Ecx 'quiche v0\.29\.3' <<<"$graph")" -eq 1 ]]
          [[ "$(grep -Ecx 'boring v5\.1\.0' <<<"$graph")" -eq 1 ]]
          [[ "$(grep -Ecx 'boring-sys v5\.1\.0' <<<"$graph")" -eq 1 ]]
          ! grep -Eq '^boring(-sys)? v4\.' <<<"$graph"
          metadata="$(cargo metadata --locked --format-version 1 \
            --no-default-features \
            --features maverick-tests/browser-tls,maverick-tests/quiche-candidate)"
          log_id='registry+https://github.com/rust-lang/crates.io-index#log@0.4.33'
          jq -e --arg log_id "$log_id" '
            (.packages | map(select(.name == "log")) | length == 1) and
            (.packages | map(select(
              .name == "log" and .version == "0.4.33" and
              .source == "registry+https://github.com/rust-lang/crates.io-index" and
              .id == $log_id
            )) | length == 1) and
            (.resolve.nodes | map(select(.id == $log_id)) | length == 1) and
            ((.resolve.nodes[] | select(.id == $log_id) | .features |
              index("max_level_debug")) != null) and
            ([.resolve.nodes[] | select(.id == $log_id) | .features[] |
              select(contains("trace"))] | length == 0)
          ' <<<"$metadata" >/dev/null
          quiche_manifest="$(jq -er '
            [.packages[] | select(.name == "quiche")] |
            if length == 1 and .[0].version == "0.29.3" and
              .[0].source == "registry+https://github.com/rust-lang/crates.io-index" and
              .[0].id == "registry+https://github.com/rust-lang/crates.io-index#quiche@0.29.3"
            then .[0].manifest_path
            else error("quiche package identity mismatch")
            end
          ' <<<"$metadata")"
          quiche_source="${quiche_manifest%/Cargo.toml}"
          repository_root="$(git rev-parse --show-toplevel)"
          [[ "$quiche_source" != "$quiche_manifest" ]]
          case "$quiche_source/" in
            "$repository_root"/*) exit 1 ;;
          esac
          [[ -d "$quiche_source/src/h3" && ! -L "$quiche_source" ]]
          [[ -f "$quiche_manifest" && ! -L "$quiche_manifest" ]]
          [[ "$(shasum -a 256 "$quiche_manifest" | awk '{print $1}')" == \
            '01434a970c9661367b730bb907d461985d2de61e521386ec79bb91a17b24ffd0' ]]
          features="$(cargo tree --locked -p maverick-tests \
            --no-default-features --features browser-tls,quiche-candidate \
            -e features -i quiche@0.29.3 --prefix none)"
          [[ "$(grep -Ecx 'quiche v0\.29\.3' <<<"$features")" -eq 1 ]]
          ! grep -Fq 'quiche feature' <<<"$features"
          expected_h3_files="$(printf '%s\n' \
            src/h3/ffi.rs \
            src/h3/frame.rs \
            src/h3/mod.rs \
            src/h3/qpack/decoder.rs \
            src/h3/qpack/encoder.rs \
            src/h3/qpack/mod.rs \
            src/h3/qpack/static_table.rs \
            src/h3/stream.rs)"
          actual_h3_files="$(find "$quiche_source/src/h3" -type f \
            -name '*.rs' -print | sed "s#^$quiche_source/##" | LC_ALL=C sort)"
          [[ "$actual_h3_files" == "$expected_h3_files" ]]
          expected_h3_hashes="$(printf '%s\n' \
            'd9e96d7a133b985d345f74671e75abe543b63014e45da7ea18c6f183aaae10c1  src/h3/ffi.rs' \
            'e15907dac76afc70ce3fdee890556a92fb94e14f39220194b44031f3a8d0a410  src/h3/frame.rs' \
            '9e00d00e09524f785e16793633bcf1f936ce13c5b8e5a73898fc65e7636b15f6  src/h3/mod.rs' \
            'e3ab2550117decde3f5de1c723ca59d81f07f0f91a3d07567acae59d512f9b1d  src/h3/qpack/decoder.rs' \
            '068f9d63efc7732887e9123feeb9f1d93471be50b53f1ae656f562f4f681161f  src/h3/qpack/encoder.rs' \
            'b2037b5485b510d6d1954e41b9ae9312ddae47120f4582b4e9630350bf9ff3a3  src/h3/qpack/mod.rs' \
            'c907b067cb1b41f68c5f15f777afcf2149ffa0a00b869a5eeabb5baf4c64e9ce  src/h3/qpack/static_table.rs' \
            'ec992ebe411261b2eb51717fc8e0a92bee928328ff830b5d7be40b86faa9b19e  src/h3/stream.rs')"
          actual_h3_hashes=""
          while IFS= read -r h3_file; do
            h3_hash="$(shasum -a 256 "$quiche_source/$h3_file" | awk '{print $1}')"
            actual_h3_hashes+="${h3_hash}  ${h3_file}"$'\n'
          done <<<"$actual_h3_files"
          actual_h3_hashes="${actual_h3_hashes%$'\n'}"
          [[ "$actual_h3_hashes" == "$expected_h3_hashes" ]]
          expected_trace_counts="$(printf '%s\n' \
            '0  src/h3/ffi.rs' \
            '0  src/h3/frame.rs' \
            '15  src/h3/mod.rs' \
            '6  src/h3/qpack/decoder.rs' \
            '0  src/h3/qpack/encoder.rs' \
            '0  src/h3/qpack/mod.rs' \
            '0  src/h3/qpack/static_table.rs' \
            '2  src/h3/stream.rs')"
          actual_trace_counts=""
          trace_call_count=0
          while IFS= read -r h3_file; do
            h3_trace_count="$(grep -E -c \
              '(^|[^[:alnum:]_])trace!\(' "$quiche_source/$h3_file" || true)"
            trace_call_count=$((trace_call_count + h3_trace_count))
            actual_trace_counts+="${h3_trace_count}  ${h3_file}"$'\n'
          done <<<"$actual_h3_files"
          actual_trace_counts="${actual_trace_counts%$'\n'}"
          [[ "$actual_trace_counts" == "$expected_trace_counts" ]]
          [[ "$trace_call_count" -eq 23 ]]
          default_cli="$(cargo tree --locked -p maverick-cli --prefix none)"
          no_default_cli="$(cargo tree --locked -p maverick-cli \
            --no-default-features --prefix none)"
          ! grep -Eq '^quiche v' <<<"$default_cli"
          ! grep -Eq '^quiche v' <<<"$no_default_cli"
          cargo test --locked -p maverick-tests --no-default-features \
            --features browser-tls,quiche-candidate \
            --test quiche_candidate -- --test-threads=1
          candidate_stat_identity() {
            case "$(uname -s)" in
              Darwin) stat -f '%d:%i:%u:%Lp' "$1" ;;
              Linux) stat -c '%d:%i:%u:%a' "$1" ;;
              *) return 1 ;;
            esac
          }
          candidate_metadata_fingerprint() {
            fingerprint_root="$1"
            if [[ ! -e "$fingerprint_root" ]]; then
              printf '%s\n' ABSENT
              return
            fi
            [[ -d "$fingerprint_root" && ! -L "$fingerprint_root" ]] ||
              return 1
            case "$(uname -s)" in
              Darwin)
                find "$fingerprint_root" -mindepth 1 \
                  -exec stat -f '%d:%i:%u:%g:%p:%z:%m:%c:%N' {} + |
                  LC_ALL=C sort | shasum -a 256 | awk '{print $1}'
                ;;
              Linux)
                find "$fingerprint_root" -mindepth 1 \
                  -exec stat -c '%d:%i:%u:%g:%f:%s:%Y:%Z:%n' {} + |
                  LC_ALL=C sort | shasum -a 256 | awk '{print $1}'
                ;;
              *) return 1 ;;
            esac
          }
          candidate_tree_hash() {
            tree_root="$1"
            tree_label="$2"
            tree_paths="$candidate_private_root/$tree_label.paths"
            tree_manifest="$candidate_private_root/$tree_label.manifest"
            if ! LC_ALL=C find "$tree_root" -mindepth 1 \
              -path "$tree_root/quiche-p1-candidate" -prune -o -print |
              sed "s#^$tree_root/##" | LC_ALL=C sort >"$tree_paths"; then
              return 1
            fi
            : >"$tree_manifest" || return 1
            while IFS= read -r tree_path; do
              if [[ -d "$tree_root/$tree_path" &&
                ! -L "$tree_root/$tree_path" ]]; then
                printf 'D\0%s\n' "$tree_path" >>"$tree_manifest" ||
                  return 1
              elif [[ -f "$tree_root/$tree_path" &&
                ! -L "$tree_root/$tree_path" ]]; then
                tree_bytes="$(
                  wc -c <"$tree_root/$tree_path" | tr -d ' '
                )" || return 1
                [[ "$tree_bytes" =~ ^[0-9]+$ ]] || return 1
                {
                  printf 'F\0%s\0%s\0' "$tree_path" "$tree_bytes"
                  openssl dgst -sha256 -binary "$tree_root/$tree_path"
                  printf '\n'
                } >>"$tree_manifest" || return 1
              else
                return 1
              fi
            done <"$tree_paths" || return 1
            tree_digest="$(
              shasum -a 256 "$tree_manifest" | awk '{print $1}'
            )" || return 1
            [[ "$tree_digest" =~ ^[0-9a-f]{64}$ ]] || return 1
            printf '%s\n' "$tree_digest"
          }
          candidate_registry_fingerprint() {
            registry_metadata="$1"
            registry_index="$candidate_private_root/registry-index.$RANDOM"
            registry_records="$candidate_private_root/registry-records.$RANDOM"
            if ! jq -er '
              .packages[] |
              select(.source ==
                "registry+https://github.com/rust-lang/crates.io-index") |
              [.id, .manifest_path] | @tsv
            ' <<<"$registry_metadata" | LC_ALL=C sort >"$registry_index"; then
              return 1
            fi
            [[ -s "$registry_index" ]] || return 1
            [[ "$(wc -l <"$registry_index" | tr -d ' ')" == 61 ]] ||
              return 1
            : >"$registry_records"
            while IFS=$'\t' read -r registry_id registry_manifest; do
              [[ -n "$registry_id" && -n "$registry_manifest" ]] ||
                return 1
              registry_package="$(dirname "$registry_manifest")"
              [[ -f "$registry_manifest" && ! -L "$registry_manifest" ]] ||
                return 1
              registry_fingerprint="$(
                candidate_metadata_fingerprint "$registry_package"
              )" || return 1
              [[ -n "$registry_fingerprint" ]] || return 1
              printf '%s %s\n' "$registry_id" "$registry_fingerprint" \
                >>"$registry_records"
            done <"$registry_index"
            [[ "$(wc -l <"$registry_records" | tr -d ' ')" == 61 ]] ||
              return 1
            registry_digest="$(
              LC_ALL=C sort "$registry_records" |
                shasum -a 256 | awk '{print $1}'
            )" || return 1
            [[ "$registry_digest" =~ ^[0-9a-f]{64}$ ]] || return 1
            printf '%s\n' "$registry_digest"
          }
          candidate_lock_registry_records() {
            awk '
              function value(line) {
                sub(/^[^"]*"/, "", line)
                sub(/".*$/, "", line)
                return line
              }
              function emit() {
                if (source ~ /^registry\+/)
                  print name "|" version "|" source "|" checksum
              }
              /^\[\[package\]\]$/ {
                emit()
                name = version = source = checksum = ""
                next
              }
              /^name = / { name = value($0); next }
              /^version = / { version = value($0); next }
              /^source = / { source = value($0); next }
              /^checksum = / { checksum = value($0); next }
              END { emit() }
            ' "$1" | LC_ALL=C sort -u
          }
          candidate_private_root=""
          candidate_target=""
          candidate_runtime_tmp=""
          candidate_marker_identity=""
          candidate_saved_umask="$(umask)"
          candidate_cleanup() {
            candidate_exit=$?
            trap - EXIT
            trap '' HUP INT TERM
            umask "$candidate_saved_umask"
            candidate_cleanup_ok=1
            if [[ -n "$candidate_private_root" ]]; then
              case "$candidate_private_root" in
                "$RUNNER_TEMP"/maverick-quiche-p1.*) ;;
                *) candidate_cleanup_ok=0 ;;
              esac
              if [[ "$candidate_cleanup_ok" -eq 1 ]]; then
                [[ -d "$candidate_private_root" &&
                  ! -L "$candidate_private_root" &&
                  -f "$candidate_private_root/.owner" &&
                  ! -L "$candidate_private_root/.owner" &&
                  "$(cat "$candidate_private_root/.owner")" == \
                    maverick-quiche-p1-candidate &&
                  "$(candidate_stat_identity "$candidate_private_root")" == \
                    "$candidate_marker_identity" ]] ||
                  candidate_cleanup_ok=0
              fi
              if [[ "$candidate_cleanup_ok" -eq 1 && -n "$candidate_target" ]]; then
                case "$candidate_target" in
                  "$candidate_private_root"/target) ;;
                  *) candidate_cleanup_ok=0 ;;
                esac
              fi
              if [[ "$candidate_cleanup_ok" -eq 1 ]]; then
                find "$candidate_private_root" -depth -delete ||
                  candidate_cleanup_ok=0
                [[ ! -e "$candidate_private_root" ]] ||
                  candidate_cleanup_ok=0
              fi
            fi
            if [[ "$candidate_exit" -eq 0 && "$candidate_cleanup_ok" -ne 1 ]]; then
              candidate_exit=1
            fi
            exit "$candidate_exit"
          }
          trap 'exit 1' HUP INT TERM
          trap candidate_cleanup EXIT
          umask 077
          candidate_private_root="$(
            mktemp -d "$RUNNER_TEMP/maverick-quiche-p1.XXXXXX"
          )"
          chmod 0700 "$candidate_private_root"
          candidate_marker_identity="$(
            candidate_stat_identity "$candidate_private_root"
          )"
          printf '%s\n' maverick-quiche-p1-candidate \
            >"$candidate_private_root/.owner"
          chmod 0600 "$candidate_private_root/.owner"
          candidate_target="$candidate_private_root/target"
          mkdir -m 0700 "$candidate_target"
          candidate_runtime_tmp="$candidate_private_root/runtime-tmp"
          mkdir -m 0700 "$candidate_runtime_tmp"

          candidate_head="$(git rev-parse HEAD)"
          candidate_status="$(
            git status --porcelain=v1 --untracked-files=all
          )"
          candidate_root_manifest_hash="$(
            shasum -a 256 Cargo.toml | awk '{print $1}'
          )"
          candidate_root_lock_hash="$(
            shasum -a 256 Cargo.lock | awk '{print $1}'
          )"
          candidate_root_target="$(jq -er .target_directory <<<"$metadata")"
          candidate_root_target_before="$(
            candidate_metadata_fingerprint "$candidate_root_target"
          )" || exit 1
          candidate_quiche_source_before="$(
            candidate_metadata_fingerprint "$quiche_source"
          )" || exit 1

          candidate_registry_key="$(basename "$(dirname "$quiche_source")")"
          case "$candidate_registry_key" in
            index.crates.io-*) ;;
            *) exit 1 ;;
          esac
          candidate_registry_root="$(
            dirname "$(dirname "$(dirname "$quiche_source")")"
          )"
          candidate_archive="$candidate_registry_root/cache/$candidate_registry_key/quiche-0.29.3.crate"
          [[ -f "$candidate_archive" && ! -L "$candidate_archive" ]]
          [[ "$(wc -c <"$candidate_archive" | tr -d ' ')" -eq 453798 ]]
          [[ "$(shasum -a 256 "$candidate_archive" | awk '{print $1}')" == \
            61166d27591eb7cb1310eec2b8fc6ae0e0686e9e4ed742a3ffc6317171175e7d ]]
          candidate_archive_copy="$candidate_private_root/quiche-0.29.3.crate"
          install -m 0400 "$candidate_archive" "$candidate_archive_copy"
          cmp "$candidate_archive" "$candidate_archive_copy"

          candidate_names="$candidate_private_root/archive.names"
          LC_ALL=C /usr/bin/tar -tzf "$candidate_archive_copy" \
            >"$candidate_names"
          [[ "$(wc -l <"$candidate_names" | tr -d ' ')" -eq 87 ]]
          [[ "$(shasum -a 256 "$candidate_names" | awk '{print $1}')" == \
            3b76e73d5e24efaa85d3a68ac59eeb4048daeba867d6a389a14e0f657e286f54 ]]
          LC_ALL=C awk '
            {
              if (length($0) > 240 ||
                  $0 !~ /^quiche-0\.29\.3\/[A-Za-z0-9._\/-]+$/ ||
                  index($0, "\\") != 0 ||
                  substr($0, 1, 1) == "/")
                exit 1
              count = split($0, parts, "/")
              for (i = 1; i <= count; i++)
                if (parts[i] == "" || parts[i] == "." || parts[i] == "..")
                  exit 1
              folded = tolower($0)
              if (seen[folded]++)
                exit 1
              paths[NR] = folded
            }
            END {
              if (NR != 87)
                exit 1
              for (i = 1; i <= NR; i++)
                for (j = 1; j <= NR; j++)
                  if (i != j && index(paths[j], paths[i] "/") == 1)
                    exit 1
            }
          ' "$candidate_names"
          candidate_headers="$candidate_private_root/archive.headers"
          LC_ALL=C /usr/bin/tar -tvzf "$candidate_archive_copy" \
            >"$candidate_headers"
          [[ "$(wc -l <"$candidate_headers" | tr -d ' ')" -eq 87 ]]
          LC_ALL=C awk 'substr($0, 1, 1) != "-" { exit 1 }' \
            "$candidate_headers"
          candidate_expanded="$candidate_private_root/archive.tar"
          /usr/bin/gzip -dc "$candidate_archive_copy" >"$candidate_expanded"
          chmod 0400 "$candidate_expanded"
          [[ "$(wc -c <"$candidate_expanded" | tr -d ' ')" -eq 2748928 ]]
          [[ "$(shasum -a 256 "$candidate_expanded" | awk '{print $1}')" == \
            7a0e3567015f7a111c3adc6e65a336dbf634fee11693e83e44dff2aed6e2439b ]]

          candidate_extracted="$candidate_private_root/extracted"
          mkdir -m 0700 "$candidate_extracted"
          candidate_tar_version="$(/usr/bin/tar --version 2>/dev/null | head -1)"
          case "$candidate_tar_version" in
            bsdtar*)
              COPYFILE_DISABLE=1 /usr/bin/tar -xf "$candidate_expanded" \
                -C "$candidate_extracted" --no-same-owner \
                --no-same-permissions --no-acls --no-fflags --no-xattrs
              ;;
            "tar (GNU tar)"*)
              /usr/bin/tar -xf "$candidate_expanded" \
                -C "$candidate_extracted" --no-same-owner \
                --no-same-permissions --no-acls --no-xattrs --no-selinux \
                --delay-directory-restore
              ;;
            *) exit 1 ;;
          esac
          candidate_source="$candidate_extracted/quiche-0.29.3"
          [[ -d "$candidate_source" && ! -L "$candidate_source" ]]
          candidate_unexpected_entry="$(find "$candidate_extracted" \
            -mindepth 1 ! -type f ! -type d -print -quit)" || exit 1
          [[ -z "$candidate_unexpected_entry" ]]
          candidate_pristine_hash="$(
            candidate_tree_hash "$candidate_extracted" pristine
          )" || exit 1
          [[ "$candidate_pristine_hash" == \
            dfe405060753b90ef580b4a105a5c0e9cf4bb4f06adc79145f94572f7a4c5851 ]]
          [[ "$(wc -l <"$candidate_private_root/pristine.paths" | tr -d ' ')" -eq 101 ]]
          [[ "$(find "$candidate_extracted" -mindepth 1 -type f | wc -l | tr -d ' ')" -eq 87 ]]
          [[ "$(find "$candidate_extracted" -mindepth 1 -type d | wc -l | tr -d ' ')" -eq 14 ]]
          [[ "$(find "$candidate_extracted" -type f -exec wc -c {} + |
            awk 'END { print $1 }')" -eq 2680769 ]]

          candidate_fixture_rel='crates/maverick-tests/fixtures/quiche-p1-candidate'
          candidate_fixture_source="$repository_root/$candidate_fixture_rel"
          candidate_fixture_files="$candidate_private_root/fixture.files"
          LC_ALL=C find "$candidate_fixture_source" -type f -print |
            sed "s#^$candidate_fixture_source/##" |
            LC_ALL=C sort >"$candidate_fixture_files"
          [[ "$(cat "$candidate_fixture_files")" == "$(printf '%s\n' \
            Cargo.lock Cargo.toml quiche-p1.patch tests/p1.rs)" ]]
          candidate_unexpected_fixture_entry="$(find \
            "$candidate_fixture_source" -mindepth 1 \
            ! -type f ! -type d -print -quit)" || exit 1
          [[ -z "$candidate_unexpected_fixture_entry" ]]
          [[ "$(find "$candidate_fixture_source" -mindepth 1 -type d \
            -print | sed "s#^$candidate_fixture_source/##")" == tests ]]
          while IFS= read -r candidate_fixture_file; do
            [[ -f "$candidate_fixture_source/$candidate_fixture_file" &&
              ! -L "$candidate_fixture_source/$candidate_fixture_file" ]]
            candidate_fixture_identity="$(
              candidate_stat_identity \
                "$candidate_fixture_source/$candidate_fixture_file"
            )"
            [[ "${candidate_fixture_identity##*:}" == 644 ]]
          done <"$candidate_fixture_files"
          candidate_fixture="$candidate_extracted/quiche-p1-candidate"
          mkdir -m 0700 "$candidate_fixture"
          mkdir -m 0700 "$candidate_fixture/tests"
          while IFS= read -r candidate_fixture_file; do
            install -m 0600 \
              "$candidate_fixture_source/$candidate_fixture_file" \
              "$candidate_fixture/$candidate_fixture_file"
            cmp "$candidate_fixture_source/$candidate_fixture_file" \
              "$candidate_fixture/$candidate_fixture_file"
          done <"$candidate_fixture_files"

          candidate_lock_registry_records "$candidate_fixture/Cargo.lock" \
            >"$candidate_private_root/fixture-lock.records"
          candidate_lock_registry_records "$repository_root/Cargo.lock" \
            >"$candidate_private_root/root-lock.records"
          [[ ! -s "$candidate_private_root/fixture-lock.records" ]] && exit 1
          [[ ! -s "$candidate_private_root/root-lock.records" ]] && exit 1
          candidate_unmatched_lock_records="$(comm -23 \
            "$candidate_private_root/fixture-lock.records" \
            "$candidate_private_root/root-lock.records")" || exit 1
          [[ -z "$candidate_unmatched_lock_records" ]]
          if env | grep -Eq '^BORING_BSSL'; then
            exit 1
          fi

          candidate_cargo=(env CARGO_NET_OFFLINE=true
            CARGO_TARGET_DIR="$candidate_target" TMPDIR="$candidate_runtime_tmp"
            CARGO_TERM_COLOR=never RUSTFLAGS=-Dwarnings cargo)
          candidate_fixture_metadata="$(
            "${candidate_cargo[@]}" metadata \
              --manifest-path "$candidate_fixture/Cargo.toml" \
              --offline --locked --format-version 1
          )"
          jq -e --arg target "$candidate_target" '
            .target_directory == $target and
            ([.packages[] | select(.source == null) | .name] | sort) ==
              ["maverick-quiche-p1-candidate", "quiche"] and
            ([.packages[] | select(.name == "boring" and .version == "5.1.0")] |
              length) == 1 and
            ([.packages[] | select(.name == "boring-sys" and
              .version == "5.1.0" and .links == "boringssl")] | length) == 1 and
            ([.packages[] | select(.links == "boringssl")] | length) == 1 and
            ([.packages[] | select(.name == "qlog" or
              (.name == "boring" and (.version | startswith("4."))) or
              (.name == "boring-sys" and (.version | startswith("4."))))] |
              length) == 0 and
            ([.packages[] | select(.source != null and
              .source != "registry+https://github.com/rust-lang/crates.io-index")] |
              length) == 0 and
            ([.packages[] | select(.name == "maverick-quiche-p1-candidate") |
              .dependencies[]] | length) == 2 and
            ([.packages[] | select(.name == "maverick-quiche-p1-candidate") |
              .dependencies[] | select(.name == "boring" and
                .req == "=5.1.0" and .source ==
                  "registry+https://github.com/rust-lang/crates.io-index" and
                .kind == null and .optional == false and .features == [])] |
              length) == 1 and
            ([.packages[] | select(.name == "maverick-quiche-p1-candidate") |
              .dependencies[] | select(.name == "quiche" and
                .req == "=0.29.3" and .source == null and .kind == null and
                .optional == false and .uses_default_features == false and
                .features == [])] | length) == 1 and
            ([.resolve.nodes[] as $node |
              .packages[] | select(.id == $node.id and .name == "quiche" and
                .version == "0.29.3") |
              select(($node.features | length) == 0)] | length) == 1
          ' <<<"$candidate_fixture_metadata" >/dev/null
          candidate_registry_before="$(
            candidate_registry_fingerprint "$candidate_fixture_metadata"
          )" || exit 1

          set +e
          "${candidate_cargo[@]}" test \
            --manifest-path "$candidate_fixture/Cargo.toml" \
            --offline --locked --test p1 --no-run \
            >"$candidate_private_root/red.stdout" \
            2>"$candidate_private_root/red.stderr"
          candidate_red_exit=$?
          set -e
          [[ "$candidate_red_exit" -ne 0 ]]
          [[ ! -s "$candidate_private_root/red.stdout" ]]
          [[ "$(grep -Ec '^error\[E0599\]' \
            "$candidate_private_root/red.stderr")" -eq 1 ]]
          grep -Fq "no method named \`set_reject_peer_push_activity\`" \
            "$candidate_private_root/red.stderr"

          candidate_patch="$candidate_fixture/quiche-p1.patch"
          [[ "$(shasum -a 256 "$candidate_patch" | awk '{print $1}')" == \
            c1023887ffab818409f69e2b971be1d15e5ded9d232d8e26b8956e4ddfec2a46 ]]
          candidate_numstat="$(
            cd "$candidate_source" &&
              git apply --numstat --no-index "$candidate_patch"
          )"
          [[ "$candidate_numstat" == "$(printf '%s\n' \
            $'61\t1\tsrc/h3/mod.rs' $'28\t12\tsrc/h3/stream.rs')" ]]
          (
            cd "$candidate_source"
            git apply --check --no-index --whitespace=error-all \
              "$candidate_patch"
            git apply --no-index --whitespace=error-all "$candidate_patch"
          )
          candidate_patched_hash="$(
            candidate_tree_hash "$candidate_extracted" patched
          )" || exit 1
          [[ "$candidate_patched_hash" == \
            ab0b52cc2f073f563ec57878893cb90885fbbdba230e165490882512a6374b7c ]]

          candidate_test_list="$(
            "${candidate_cargo[@]}" test \
              --manifest-path "$candidate_fixture/Cargo.toml" \
              --offline --locked --test p1 -- --list
          )"
          [[ "$(grep -E ': test$' <<<"$candidate_test_list" |
            LC_ALL=C sort)" == "$(printf '%s\n' \
            'omitted_and_explicit_false_preserve_every_pristine_peer_push_outcome: test' \
            'strict_peer_push_gate_preserves_non_push_h3_behavior: test' \
            'strict_peer_push_gate_rejects_every_surface_at_every_fragment_boundary: test')" ]]
          "${candidate_cargo[@]}" test \
            --manifest-path "$candidate_fixture/Cargo.toml" \
            --offline --locked --test p1 -- --test-threads=1
          candidate_runtime_leftover="$(find "$candidate_runtime_tmp" \
            -mindepth 1 -print -quit)" || exit 1
          [[ -z "$candidate_runtime_leftover" ]]

          [[ "$(git rev-parse HEAD)" == "$candidate_head" ]]
          [[ "$(git status --porcelain=v1 --untracked-files=all)" == \
            "$candidate_status" ]]
          [[ "$(shasum -a 256 Cargo.toml | awk '{print $1}')" == \
            "$candidate_root_manifest_hash" ]]
          [[ "$(shasum -a 256 Cargo.lock | awk '{print $1}')" == \
            "$candidate_root_lock_hash" ]]
          candidate_root_target_after="$(
            candidate_metadata_fingerprint "$candidate_root_target"
          )" || exit 1
          [[ "$candidate_root_target_after" == "$candidate_root_target_before" ]]
          candidate_quiche_source_after="$(
            candidate_metadata_fingerprint "$quiche_source"
          )" || exit 1
          [[ "$candidate_quiche_source_after" == \
            "$candidate_quiche_source_before" ]]
          candidate_registry_after="$(
            candidate_registry_fingerprint "$candidate_fixture_metadata"
          )" || exit 1
          [[ "$candidate_registry_after" == "$candidate_registry_before" ]]
          [[ "$(wc -c <"$candidate_archive" | tr -d ' ')" -eq 453798 ]]
          [[ "$(shasum -a 256 "$candidate_archive" | awk '{print $1}')" == \
            61166d27591eb7cb1310eec2b8fc6ae0e0686e9e4ed742a3ffc6317171175e7d ]]
          cmp "$candidate_archive" "$candidate_archive_copy"
      - name: Build the exact-head GNU/Linux pilot archive
        id: pilot
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          actual_revision="$(git rev-parse HEAD)"
          if [[ "$actual_revision" != "$MAVERICK_EXPECTED_REVISION" ]]; then
            echo "checked-out revision does not match the selected event revision" >&2
            exit 1
          fi
          printf 'revision=%s\n' "$actual_revision" >>"$GITHUB_OUTPUT"
          ./scripts/build-pilot.sh
      - name: Statically verify the GNU/Linux pilot archive
        if: steps.scope.outputs.docs_only != 'true'
        env:
          MAVERICK_PILOT_REVISION: ${{ steps.pilot.outputs.revision }}
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)"
          ./scripts/verify-pilot-artifact.sh \
            --archive "dist/maverick-${version}-pilot-${MAVERICK_PILOT_TARGET}.tar.gz" \
            --expected-version "$version" \
            --expected-revision "$MAVERICK_PILOT_REVISION" \
            --expected-target "$MAVERICK_PILOT_TARGET" \
            --verification-level static
      - name: Natively verify the GNU/Linux pilot archive
        if: steps.scope.outputs.docs_only != 'true'
        env:
          MAVERICK_PILOT_REVISION: ${{ steps.pilot.outputs.revision }}
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)"
          ./scripts/verify-pilot-artifact.sh \
            --archive "dist/maverick-${version}-pilot-${MAVERICK_PILOT_TARGET}.tar.gz" \
            --expected-version "$version" \
            --expected-revision "$MAVERICK_PILOT_REVISION" \
            --expected-target "$MAVERICK_PILOT_TARGET" \
            --verification-level native
      - name: Generate and fully verify the GNU/Linux candidate SBOM
        if: steps.scope.outputs.docs_only != 'true'
        env:
          MAVERICK_PILOT_REVISION: ${{ steps.pilot.outputs.revision }}
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)"
          sbom="dist/maverick-${version}-pilot-${MAVERICK_PILOT_TARGET}.cdx.json"
          ./scripts/generate-cyclonedx-sbom.sh \
            --expected-version "$version" \
            --expected-revision "$MAVERICK_PILOT_REVISION" \
            --target "$MAVERICK_PILOT_TARGET" \
            --output "$sbom"
          ./scripts/verify-cyclonedx-sbom.sh \
            --sbom "$sbom" \
            --expected-version "$version" \
            --expected-revision "$MAVERICK_PILOT_REVISION" \
            --expected-target "$MAVERICK_PILOT_TARGET" \
            --verification-level full \
            --source-root .
      - name: Exercise RC.1 upgrade and Beta.4 rollback on GNU/Linux
        if: steps.scope.outputs.docs_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MAVERICK_PILOT_REVISION: ${{ steps.pilot.outputs.revision }}
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)"
          previous_dir="$(mktemp -d "$RUNNER_TEMP/maverick-beta4.XXXXXX")"
          chmod 0700 "$previous_dir"
          gh release download v1.2.0-beta.4 --dir "$previous_dir" \
            --pattern "maverick-1.2.0-beta.4-pilot-${MAVERICK_PILOT_TARGET}.tar.gz" \
            --pattern "maverick-1.2.0-beta.4-pilot-${MAVERICK_PILOT_TARGET}.tar.gz.sha256"
          ./scripts/test-n-minus-one-release-drill.sh \
            --target "$MAVERICK_PILOT_TARGET" \
            --previous-archive "$previous_dir/maverick-1.2.0-beta.4-pilot-${MAVERICK_PILOT_TARGET}.tar.gz" \
            --previous-checksum "$previous_dir/maverick-1.2.0-beta.4-pilot-${MAVERICK_PILOT_TARGET}.tar.gz.sha256" \
            --candidate-archive "dist/maverick-${version}-pilot-${MAVERICK_PILOT_TARGET}.tar.gz" \
            --candidate-checksum "dist/maverick-${version}-pilot-${MAVERICK_PILOT_TARGET}.tar.gz.sha256" \
            --candidate-revision "$MAVERICK_PILOT_REVISION"
      - name: Run the local product harness
        if: steps.scope.outputs.docs_only != 'true'
        run: ./scripts/local-harness.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.scope.outputs.docs_only != 'true'
        with:
          name: rc-candidate-x86_64-unknown-linux-gnu
          path: |
            dist/maverick-1.2.0-rc.1-pilot-x86_64-unknown-linux-gnu.tar.gz
            dist/maverick-1.2.0-rc.1-pilot-x86_64-unknown-linux-gnu.tar.gz.sha256
            dist/maverick-1.2.0-rc.1-pilot-x86_64-unknown-linux-gnu.cdx.json
          if-no-files-found: error
          retention-days: 7

  macos-sbom-gate:
    needs: public-pr-gate
    if: ${{ needs.public-pr-gate.outputs.docs_only != 'true' }}
    runs-on: macos-14
    timeout-minutes: 30
    env:
      MAVERICK_EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      MAVERICK_PILOT_TARGET: aarch64-apple-darwin
      MAVERICK_SBOM_TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.1
      - run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - run: cargo fetch --locked --target "$MAVERICK_SBOM_TARGET"
      - name: Evaluate the default-off quiche candidate
        run: |
          set -euo pipefail
          graph="$(cargo tree --locked -p maverick-tests \
            --no-default-features --features browser-tls,quiche-candidate \
            --target "$MAVERICK_SBOM_TARGET" \
            --edges normal,build --prefix none)"
          [[ "$(grep -Ecx 'quiche v0\.29\.3' <<<"$graph")" -eq 1 ]]
          [[ "$(grep -Ecx 'boring v5\.1\.0' <<<"$graph")" -eq 1 ]]
          [[ "$(grep -Ecx 'boring-sys v5\.1\.0' <<<"$graph")" -eq 1 ]]
          ! grep -Eq '^boring(-sys)? v4\.' <<<"$graph"
          metadata="$(cargo metadata --locked --format-version 1 \
            --no-default-features \
            --features maverick-tests/browser-tls,maverick-tests/quiche-candidate)"
          log_id='registry+https://github.com/rust-lang/crates.io-index#log@0.4.33'
          jq -e --arg log_id "$log_id" '
            (.packages | map(select(.name == "log")) | length == 1) and
            (.packages | map(select(
              .name == "log" and .version == "0.4.33" and
              .source == "registry+https://github.com/rust-lang/crates.io-index" and
              .id == $log_id
            )) | length == 1) and
            (.resolve.nodes | map(select(.id == $log_id)) | length == 1) and
            ((.resolve.nodes[] | select(.id == $log_id) | .features |
              index("max_level_debug")) != null) and
            ([.resolve.nodes[] | select(.id == $log_id) | .features[] |
              select(contains("trace"))] | length == 0)
          ' <<<"$metadata" >/dev/null
          quiche_manifest="$(jq -er '
            [.packages[] | select(.name == "quiche")] |
            if length == 1 and .[0].version == "0.29.3" and
              .[0].source == "registry+https://github.com/rust-lang/crates.io-index" and
              .[0].id == "registry+https://github.com/rust-lang/crates.io-index#quiche@0.29.3"
            then .[0].manifest_path
            else error("quiche package identity mismatch")
            end
          ' <<<"$metadata")"
          quiche_source="${quiche_manifest%/Cargo.toml}"
          repository_root="$(git rev-parse --show-toplevel)"
          [[ "$quiche_source" != "$quiche_manifest" ]]
          case "$quiche_source/" in
            "$repository_root"/*) exit 1 ;;
          esac
          [[ -d "$quiche_source/src/h3" && ! -L "$quiche_source" ]]
          [[ -f "$quiche_manifest" && ! -L "$quiche_manifest" ]]
          [[ "$(shasum -a 256 "$quiche_manifest" | awk '{print $1}')" == \
            '01434a970c9661367b730bb907d461985d2de61e521386ec79bb91a17b24ffd0' ]]
          features="$(cargo tree --locked -p maverick-tests \
            --no-default-features --features browser-tls,quiche-candidate \
            --target "$MAVERICK_SBOM_TARGET" \
            -e features -i quiche@0.29.3 --prefix none)"
          [[ "$(grep -Ecx 'quiche v0\.29\.3' <<<"$features")" -eq 1 ]]
          ! grep -Fq 'quiche feature' <<<"$features"
          expected_h3_files="$(printf '%s\n' \
            src/h3/ffi.rs \
            src/h3/frame.rs \
            src/h3/mod.rs \
            src/h3/qpack/decoder.rs \
            src/h3/qpack/encoder.rs \
            src/h3/qpack/mod.rs \
            src/h3/qpack/static_table.rs \
            src/h3/stream.rs)"
          actual_h3_files="$(find "$quiche_source/src/h3" -type f \
            -name '*.rs' -print | sed "s#^$quiche_source/##" | LC_ALL=C sort)"
          [[ "$actual_h3_files" == "$expected_h3_files" ]]
          expected_h3_hashes="$(printf '%s\n' \
            'd9e96d7a133b985d345f74671e75abe543b63014e45da7ea18c6f183aaae10c1  src/h3/ffi.rs' \
            'e15907dac76afc70ce3fdee890556a92fb94e14f39220194b44031f3a8d0a410  src/h3/frame.rs' \
            '9e00d00e09524f785e16793633bcf1f936ce13c5b8e5a73898fc65e7636b15f6  src/h3/mod.rs' \
            'e3ab2550117decde3f5de1c723ca59d81f07f0f91a3d07567acae59d512f9b1d  src/h3/qpack/decoder.rs' \
            '068f9d63efc7732887e9123feeb9f1d93471be50b53f1ae656f562f4f681161f  src/h3/qpack/encoder.rs' \
            'b2037b5485b510d6d1954e41b9ae9312ddae47120f4582b4e9630350bf9ff3a3  src/h3/qpack/mod.rs' \
            'c907b067cb1b41f68c5f15f777afcf2149ffa0a00b869a5eeabb5baf4c64e9ce  src/h3/qpack/static_table.rs' \
            'ec992ebe411261b2eb51717fc8e0a92bee928328ff830b5d7be40b86faa9b19e  src/h3/stream.rs')"
          actual_h3_hashes=""
          while IFS= read -r h3_file; do
            h3_hash="$(shasum -a 256 "$quiche_source/$h3_file" | awk '{print $1}')"
            actual_h3_hashes+="${h3_hash}  ${h3_file}"$'\n'
          done <<<"$actual_h3_files"
          actual_h3_hashes="${actual_h3_hashes%$'\n'}"
          [[ "$actual_h3_hashes" == "$expected_h3_hashes" ]]
          expected_trace_counts="$(printf '%s\n' \
            '0  src/h3/ffi.rs' \
            '0  src/h3/frame.rs' \
            '15  src/h3/mod.rs' \
            '6  src/h3/qpack/decoder.rs' \
            '0  src/h3/qpack/encoder.rs' \
            '0  src/h3/qpack/mod.rs' \
            '0  src/h3/qpack/static_table.rs' \
            '2  src/h3/stream.rs')"
          actual_trace_counts=""
          trace_call_count=0
          while IFS= read -r h3_file; do
            h3_trace_count="$(grep -E -c \
              '(^|[^[:alnum:]_])trace!\(' "$quiche_source/$h3_file" || true)"
            trace_call_count=$((trace_call_count + h3_trace_count))
            actual_trace_counts+="${h3_trace_count}  ${h3_file}"$'\n'
          done <<<"$actual_h3_files"
          actual_trace_counts="${actual_trace_counts%$'\n'}"
          [[ "$actual_trace_counts" == "$expected_trace_counts" ]]
          [[ "$trace_call_count" -eq 23 ]]
          default_cli="$(cargo tree --locked -p maverick-cli \
            --target "$MAVERICK_SBOM_TARGET" --prefix none)"
          no_default_cli="$(cargo tree --locked -p maverick-cli \
            --no-default-features --target "$MAVERICK_SBOM_TARGET" \
            --prefix none)"
          ! grep -Eq '^quiche v' <<<"$default_cli"
          ! grep -Eq '^quiche v' <<<"$no_default_cli"
          cargo test --locked -p maverick-tests --no-default-features \
            --features browser-tls,quiche-candidate \
            --test quiche_candidate -- --test-threads=1
          candidate_stat_identity() {
            case "$(uname -s)" in
              Darwin) stat -f '%d:%i:%u:%Lp' "$1" ;;
              Linux) stat -c '%d:%i:%u:%a' "$1" ;;
              *) return 1 ;;
            esac
          }
          candidate_metadata_fingerprint() {
            fingerprint_root="$1"
            if [[ ! -e "$fingerprint_root" ]]; then
              printf '%s\n' ABSENT
              return
            fi
            [[ -d "$fingerprint_root" && ! -L "$fingerprint_root" ]] ||
              return 1
            case "$(uname -s)" in
              Darwin)
                find "$fingerprint_root" -mindepth 1 \
                  -exec stat -f '%d:%i:%u:%g:%p:%z:%m:%c:%N' {} + |
                  LC_ALL=C sort | shasum -a 256 | awk '{print $1}'
                ;;
              Linux)
                find "$fingerprint_root" -mindepth 1 \
                  -exec stat -c '%d:%i:%u:%g:%f:%s:%Y:%Z:%n' {} + |
                  LC_ALL=C sort | shasum -a 256 | awk '{print $1}'
                ;;
              *) return 1 ;;
            esac
          }
          candidate_tree_hash() {
            tree_root="$1"
            tree_label="$2"
            tree_paths="$candidate_private_root/$tree_label.paths"
            tree_manifest="$candidate_private_root/$tree_label.manifest"
            if ! LC_ALL=C find "$tree_root" -mindepth 1 \
              -path "$tree_root/quiche-p1-candidate" -prune -o -print |
              sed "s#^$tree_root/##" | LC_ALL=C sort >"$tree_paths"; then
              return 1
            fi
            : >"$tree_manifest" || return 1
            while IFS= read -r tree_path; do
              if [[ -d "$tree_root/$tree_path" &&
                ! -L "$tree_root/$tree_path" ]]; then
                printf 'D\0%s\n' "$tree_path" >>"$tree_manifest" ||
                  return 1
              elif [[ -f "$tree_root/$tree_path" &&
                ! -L "$tree_root/$tree_path" ]]; then
                tree_bytes="$(
                  wc -c <"$tree_root/$tree_path" | tr -d ' '
                )" || return 1
                [[ "$tree_bytes" =~ ^[0-9]+$ ]] || return 1
                {
                  printf 'F\0%s\0%s\0' "$tree_path" "$tree_bytes"
                  openssl dgst -sha256 -binary "$tree_root/$tree_path"
                  printf '\n'
                } >>"$tree_manifest" || return 1
              else
                return 1
              fi
            done <"$tree_paths" || return 1
            tree_digest="$(
              shasum -a 256 "$tree_manifest" | awk '{print $1}'
            )" || return 1
            [[ "$tree_digest" =~ ^[0-9a-f]{64}$ ]] || return 1
            printf '%s\n' "$tree_digest"
          }
          candidate_registry_fingerprint() {
            registry_metadata="$1"
            registry_index="$candidate_private_root/registry-index.$RANDOM"
            registry_records="$candidate_private_root/registry-records.$RANDOM"
            if ! jq -er '
              .packages[] |
              select(.source ==
                "registry+https://github.com/rust-lang/crates.io-index") |
              [.id, .manifest_path] | @tsv
            ' <<<"$registry_metadata" | LC_ALL=C sort >"$registry_index"; then
              return 1
            fi
            [[ -s "$registry_index" ]] || return 1
            [[ "$(wc -l <"$registry_index" | tr -d ' ')" == 61 ]] ||
              return 1
            : >"$registry_records"
            while IFS=$'\t' read -r registry_id registry_manifest; do
              [[ -n "$registry_id" && -n "$registry_manifest" ]] ||
                return 1
              registry_package="$(dirname "$registry_manifest")"
              [[ -f "$registry_manifest" && ! -L "$registry_manifest" ]] ||
                return 1
              registry_fingerprint="$(
                candidate_metadata_fingerprint "$registry_package"
              )" || return 1
              [[ -n "$registry_fingerprint" ]] || return 1
              printf '%s %s\n' "$registry_id" "$registry_fingerprint" \
                >>"$registry_records"
            done <"$registry_index"
            [[ "$(wc -l <"$registry_records" | tr -d ' ')" == 61 ]] ||
              return 1
            registry_digest="$(
              LC_ALL=C sort "$registry_records" |
                shasum -a 256 | awk '{print $1}'
            )" || return 1
            [[ "$registry_digest" =~ ^[0-9a-f]{64}$ ]] || return 1
            printf '%s\n' "$registry_digest"
          }
          candidate_lock_registry_records() {
            awk '
              function value(line) {
                sub(/^[^"]*"/, "", line)
                sub(/".*$/, "", line)
                return line
              }
              function emit() {
                if (source ~ /^registry\+/)
                  print name "|" version "|" source "|" checksum
              }
              /^\[\[package\]\]$/ {
                emit()
                name = version = source = checksum = ""
                next
              }
              /^name = / { name = value($0); next }
              /^version = / { version = value($0); next }
              /^source = / { source = value($0); next }
              /^checksum = / { checksum = value($0); next }
              END { emit() }
            ' "$1" | LC_ALL=C sort -u
          }
          candidate_private_root=""
          candidate_target=""
          candidate_runtime_tmp=""
          candidate_marker_identity=""
          candidate_saved_umask="$(umask)"
          candidate_cleanup() {
            candidate_exit=$?
            trap - EXIT
            trap '' HUP INT TERM
            umask "$candidate_saved_umask"
            candidate_cleanup_ok=1
            if [[ -n "$candidate_private_root" ]]; then
              case "$candidate_private_root" in
                "$RUNNER_TEMP"/maverick-quiche-p1.*) ;;
                *) candidate_cleanup_ok=0 ;;
              esac
              if [[ "$candidate_cleanup_ok" -eq 1 ]]; then
                [[ -d "$candidate_private_root" &&
                  ! -L "$candidate_private_root" &&
                  -f "$candidate_private_root/.owner" &&
                  ! -L "$candidate_private_root/.owner" &&
                  "$(cat "$candidate_private_root/.owner")" == \
                    maverick-quiche-p1-candidate &&
                  "$(candidate_stat_identity "$candidate_private_root")" == \
                    "$candidate_marker_identity" ]] ||
                  candidate_cleanup_ok=0
              fi
              if [[ "$candidate_cleanup_ok" -eq 1 && -n "$candidate_target" ]]; then
                case "$candidate_target" in
                  "$candidate_private_root"/target) ;;
                  *) candidate_cleanup_ok=0 ;;
                esac
              fi
              if [[ "$candidate_cleanup_ok" -eq 1 ]]; then
                find "$candidate_private_root" -depth -delete ||
                  candidate_cleanup_ok=0
                [[ ! -e "$candidate_private_root" ]] ||
                  candidate_cleanup_ok=0
              fi
            fi
            if [[ "$candidate_exit" -eq 0 && "$candidate_cleanup_ok" -ne 1 ]]; then
              candidate_exit=1
            fi
            exit "$candidate_exit"
          }
          trap 'exit 1' HUP INT TERM
          trap candidate_cleanup EXIT
          umask 077
          candidate_private_root="$(
            mktemp -d "$RUNNER_TEMP/maverick-quiche-p1.XXXXXX"
          )"
          chmod 0700 "$candidate_private_root"
          candidate_marker_identity="$(
            candidate_stat_identity "$candidate_private_root"
          )"
          printf '%s\n' maverick-quiche-p1-candidate \
            >"$candidate_private_root/.owner"
          chmod 0600 "$candidate_private_root/.owner"
          candidate_target="$candidate_private_root/target"
          mkdir -m 0700 "$candidate_target"
          candidate_runtime_tmp="$candidate_private_root/runtime-tmp"
          mkdir -m 0700 "$candidate_runtime_tmp"

          candidate_head="$(git rev-parse HEAD)"
          candidate_status="$(
            git status --porcelain=v1 --untracked-files=all
          )"
          candidate_root_manifest_hash="$(
            shasum -a 256 Cargo.toml | awk '{print $1}'
          )"
          candidate_root_lock_hash="$(
            shasum -a 256 Cargo.lock | awk '{print $1}'
          )"
          candidate_root_target="$(jq -er .target_directory <<<"$metadata")"
          candidate_root_target_before="$(
            candidate_metadata_fingerprint "$candidate_root_target"
          )" || exit 1
          candidate_quiche_source_before="$(
            candidate_metadata_fingerprint "$quiche_source"
          )" || exit 1

          candidate_registry_key="$(basename "$(dirname "$quiche_source")")"
          case "$candidate_registry_key" in
            index.crates.io-*) ;;
            *) exit 1 ;;
          esac
          candidate_registry_root="$(
            dirname "$(dirname "$(dirname "$quiche_source")")"
          )"
          candidate_archive="$candidate_registry_root/cache/$candidate_registry_key/quiche-0.29.3.crate"
          [[ -f "$candidate_archive" && ! -L "$candidate_archive" ]]
          [[ "$(wc -c <"$candidate_archive" | tr -d ' ')" -eq 453798 ]]
          [[ "$(shasum -a 256 "$candidate_archive" | awk '{print $1}')" == \
            61166d27591eb7cb1310eec2b8fc6ae0e0686e9e4ed742a3ffc6317171175e7d ]]
          candidate_archive_copy="$candidate_private_root/quiche-0.29.3.crate"
          install -m 0400 "$candidate_archive" "$candidate_archive_copy"
          cmp "$candidate_archive" "$candidate_archive_copy"

          candidate_names="$candidate_private_root/archive.names"
          LC_ALL=C /usr/bin/tar -tzf "$candidate_archive_copy" \
            >"$candidate_names"
          [[ "$(wc -l <"$candidate_names" | tr -d ' ')" -eq 87 ]]
          [[ "$(shasum -a 256 "$candidate_names" | awk '{print $1}')" == \
            3b76e73d5e24efaa85d3a68ac59eeb4048daeba867d6a389a14e0f657e286f54 ]]
          LC_ALL=C awk '
            {
              if (length($0) > 240 ||
                  $0 !~ /^quiche-0\.29\.3\/[A-Za-z0-9._\/-]+$/ ||
                  index($0, "\\") != 0 ||
                  substr($0, 1, 1) == "/")
                exit 1
              count = split($0, parts, "/")
              for (i = 1; i <= count; i++)
                if (parts[i] == "" || parts[i] == "." || parts[i] == "..")
                  exit 1
              folded = tolower($0)
              if (seen[folded]++)
                exit 1
              paths[NR] = folded
            }
            END {
              if (NR != 87)
                exit 1
              for (i = 1; i <= NR; i++)
                for (j = 1; j <= NR; j++)
                  if (i != j && index(paths[j], paths[i] "/") == 1)
                    exit 1
            }
          ' "$candidate_names"
          candidate_headers="$candidate_private_root/archive.headers"
          LC_ALL=C /usr/bin/tar -tvzf "$candidate_archive_copy" \
            >"$candidate_headers"
          [[ "$(wc -l <"$candidate_headers" | tr -d ' ')" -eq 87 ]]
          LC_ALL=C awk 'substr($0, 1, 1) != "-" { exit 1 }' \
            "$candidate_headers"
          candidate_expanded="$candidate_private_root/archive.tar"
          /usr/bin/gzip -dc "$candidate_archive_copy" >"$candidate_expanded"
          chmod 0400 "$candidate_expanded"
          [[ "$(wc -c <"$candidate_expanded" | tr -d ' ')" -eq 2748928 ]]
          [[ "$(shasum -a 256 "$candidate_expanded" | awk '{print $1}')" == \
            7a0e3567015f7a111c3adc6e65a336dbf634fee11693e83e44dff2aed6e2439b ]]

          candidate_extracted="$candidate_private_root/extracted"
          mkdir -m 0700 "$candidate_extracted"
          candidate_tar_version="$(/usr/bin/tar --version 2>/dev/null | head -1)"
          case "$candidate_tar_version" in
            bsdtar*)
              COPYFILE_DISABLE=1 /usr/bin/tar -xf "$candidate_expanded" \
                -C "$candidate_extracted" --no-same-owner \
                --no-same-permissions --no-acls --no-fflags --no-xattrs
              ;;
            "tar (GNU tar)"*)
              /usr/bin/tar -xf "$candidate_expanded" \
                -C "$candidate_extracted" --no-same-owner \
                --no-same-permissions --no-acls --no-xattrs --no-selinux \
                --delay-directory-restore
              ;;
            *) exit 1 ;;
          esac
          candidate_source="$candidate_extracted/quiche-0.29.3"
          [[ -d "$candidate_source" && ! -L "$candidate_source" ]]
          candidate_unexpected_entry="$(find "$candidate_extracted" \
            -mindepth 1 ! -type f ! -type d -print -quit)" || exit 1
          [[ -z "$candidate_unexpected_entry" ]]
          candidate_pristine_hash="$(
            candidate_tree_hash "$candidate_extracted" pristine
          )" || exit 1
          [[ "$candidate_pristine_hash" == \
            dfe405060753b90ef580b4a105a5c0e9cf4bb4f06adc79145f94572f7a4c5851 ]]
          [[ "$(wc -l <"$candidate_private_root/pristine.paths" | tr -d ' ')" -eq 101 ]]
          [[ "$(find "$candidate_extracted" -mindepth 1 -type f | wc -l | tr -d ' ')" -eq 87 ]]
          [[ "$(find "$candidate_extracted" -mindepth 1 -type d | wc -l | tr -d ' ')" -eq 14 ]]
          [[ "$(find "$candidate_extracted" -type f -exec wc -c {} + |
            awk 'END { print $1 }')" -eq 2680769 ]]

          candidate_fixture_rel='crates/maverick-tests/fixtures/quiche-p1-candidate'
          candidate_fixture_source="$repository_root/$candidate_fixture_rel"
          candidate_fixture_files="$candidate_private_root/fixture.files"
          LC_ALL=C find "$candidate_fixture_source" -type f -print |
            sed "s#^$candidate_fixture_source/##" |
            LC_ALL=C sort >"$candidate_fixture_files"
          [[ "$(cat "$candidate_fixture_files")" == "$(printf '%s\n' \
            Cargo.lock Cargo.toml quiche-p1.patch tests/p1.rs)" ]]
          candidate_unexpected_fixture_entry="$(find \
            "$candidate_fixture_source" -mindepth 1 \
            ! -type f ! -type d -print -quit)" || exit 1
          [[ -z "$candidate_unexpected_fixture_entry" ]]
          [[ "$(find "$candidate_fixture_source" -mindepth 1 -type d \
            -print | sed "s#^$candidate_fixture_source/##")" == tests ]]
          while IFS= read -r candidate_fixture_file; do
            [[ -f "$candidate_fixture_source/$candidate_fixture_file" &&
              ! -L "$candidate_fixture_source/$candidate_fixture_file" ]]
            candidate_fixture_identity="$(
              candidate_stat_identity \
                "$candidate_fixture_source/$candidate_fixture_file"
            )"
            [[ "${candidate_fixture_identity##*:}" == 644 ]]
          done <"$candidate_fixture_files"
          candidate_fixture="$candidate_extracted/quiche-p1-candidate"
          mkdir -m 0700 "$candidate_fixture"
          mkdir -m 0700 "$candidate_fixture/tests"
          while IFS= read -r candidate_fixture_file; do
            install -m 0600 \
              "$candidate_fixture_source/$candidate_fixture_file" \
              "$candidate_fixture/$candidate_fixture_file"
            cmp "$candidate_fixture_source/$candidate_fixture_file" \
              "$candidate_fixture/$candidate_fixture_file"
          done <"$candidate_fixture_files"

          candidate_lock_registry_records "$candidate_fixture/Cargo.lock" \
            >"$candidate_private_root/fixture-lock.records"
          candidate_lock_registry_records "$repository_root/Cargo.lock" \
            >"$candidate_private_root/root-lock.records"
          [[ ! -s "$candidate_private_root/fixture-lock.records" ]] && exit 1
          [[ ! -s "$candidate_private_root/root-lock.records" ]] && exit 1
          candidate_unmatched_lock_records="$(comm -23 \
            "$candidate_private_root/fixture-lock.records" \
            "$candidate_private_root/root-lock.records")" || exit 1
          [[ -z "$candidate_unmatched_lock_records" ]]
