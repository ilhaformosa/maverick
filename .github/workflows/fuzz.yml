name: parser-fuzz

on:
  schedule:
    - cron: "17 5 * * 0"
  workflow_dispatch:

concurrency:
  group: parser-fuzz-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  parser-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: nightly-2026-07-21
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Check fuzz targets
        run: cargo check --manifest-path fuzz/Cargo.toml --bins
      - name: Run bounded parser fuzzing
        working-directory: fuzz
        run: |
          cargo +nightly-2026-07-21 fuzz run frame_decode -- -runs=256
          cargo +nightly-2026-07-21 fuzz run auth_decode -- -runs=256
