name: parser-fuzz

on:
  schedule:
    - cron: "17 5 * * 0"
  workflow_dispatch:

concurrency:
  group: parser-fuzz-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  parser-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: nightly-2026-11-16
          components: rust-src
      - run: cargo +nightly-2026-11-16 install cargo-fuzz --version 0.13.2 --locked
      - name: Check fuzz targets
        run: cargo +nightly-2026-11-16 check --locked --manifest-path fuzz/Cargo.toml --bins
      - name: Run bounded parser fuzzing
        working-directory: fuzz
        run: |
          cargo +nightly-2026-11-16 fuzz run frame_decode -- -runs=256
          cargo +nightly-2026-11-16 fuzz run auth_decode -- -runs=256
      - name: Require the committed fuzz dependency graph
        run: git diff --exit-code -- fuzz/Cargo.lock
