name: pilot-release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: pilot-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y binutils clang cmake file ripgrep shellcheck
      - name: Verify the current remote tag, current main, and product gates
        run: |
          version="$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)"
          git fetch --no-tags --force --atomic origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          ./scripts/verify-release-tag.sh \
            --tag "$GITHUB_REF_NAME" \
            --sha "$GITHUB_SHA" \
            --version "$version" \
            --main-ref origin/main
          ./scripts/local-harness.sh

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y binutils clang cmake file ripgrep
      - name: Build shareable pilot archive
        env:
          MAVERICK_PILOT_TARGET: ${{ matrix.target }}
        run: |
          version="$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)"
          archive="dist/maverick-${version}-pilot-${MAVERICK_PILOT_TARGET}.tar.gz"
          ./scripts/build-pilot.sh
          ./scripts/verify-pilot-artifact.sh \
            --archive "$archive" \
            --expected-version "$version" \
            --expected-revision "$GITHUB_SHA" \
            --expected-target "$MAVERICK_PILOT_TARGET" \
            --verification-level native
      - name: Reverify the exact files approved for upload
        id: reverified
        env:
          MAVERICK_PILOT_TARGET: ${{ matrix.target }}
        run: |
          version="$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)"
          archive_name="maverick-${version}-pilot-${MAVERICK_PILOT_TARGET}.tar.gz"
          staging="$(mktemp -d "$RUNNER_TEMP/maverick-verified.XXXXXX")"
          chmod 700 "$staging"
          cp "dist/$archive_name" "$staging/$archive_name"
          cp "dist/$archive_name.sha256" "$staging/$archive_name.sha256"
          chmod 0444 "$staging/$archive_name" "$staging/$archive_name.sha256"
          ./scripts/verify-pilot-artifact.sh \
            --archive "$staging/$archive_name" \
            --expected-version "$version" \
            --expected-revision "$GITHUB_SHA" \
            --expected-target "$MAVERICK_PILOT_TARGET" \
            --verification-level static
          chmod 0555 "$staging"
          {
            echo "archive=$staging/$archive_name"
            echo "checksum=$staging/$archive_name.sha256"
          } >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pilot-${{ matrix.target }}
          path: |
            ${{ steps.reverified.outputs.archive }}
            ${{ steps.reverified.outputs.checksum }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pilot-x86_64-unknown-linux-gnu
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pilot-aarch64-apple-darwin
          path: dist
      - name: Statically reverify the exact four files selected for publication
        id: reverified
        run: |
          version="$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)"
          linux_name="maverick-${version}-pilot-x86_64-unknown-linux-gnu.tar.gz"
          mac_name="maverick-${version}-pilot-aarch64-apple-darwin.tar.gz"
          expected_files="$(
            printf '%s\n' \
              "$linux_name" "$linux_name.sha256" \
              "$mac_name" "$mac_name.sha256" |
              LC_ALL=C sort
          )"
          actual_files="$(
            find dist -mindepth 1 -maxdepth 1 -type f ! -type l -print |
              sed 's#^dist/##' |
              LC_ALL=C sort
          )"
          test "$actual_files" = "$expected_files"
          test "$(find dist -mindepth 1 -maxdepth 1 -print | wc -l)" -eq 4
          staging="$(mktemp -d "$RUNNER_TEMP/maverick-publish.XXXXXX")"
          chmod 700 "$staging"
          for name in \
            "$linux_name" "$linux_name.sha256" \
            "$mac_name" "$mac_name.sha256"; do
            cp "dist/$name" "$staging/$name"
            chmod 0444 "$staging/$name"
          done
          ./scripts/verify-pilot-artifact.sh \
            --archive "$staging/$linux_name" \
            --expected-version "$version" \
            --expected-revision "$GITHUB_SHA" \
            --expected-target x86_64-unknown-linux-gnu \
            --verification-level static
          ./scripts/verify-pilot-artifact.sh \
            --archive "$staging/$mac_name" \
            --expected-version "$version" \
            --expected-revision "$GITHUB_SHA" \
            --expected-target aarch64-apple-darwin \
            --verification-level static
          linux_sha="$(sha256sum "$staging/$linux_name" | awk '{print $1}')"
          linux_checksum_sha="$(sha256sum "$staging/$linux_name.sha256" | awk '{print $1}')"
          mac_sha="$(sha256sum "$staging/$mac_name" | awk '{print $1}')"
          mac_checksum_sha="$(sha256sum "$staging/$mac_name.sha256" | awk '{print $1}')"
          chmod 0555 "$staging"
          notes_file="$(mktemp "$RUNNER_TEMP/maverick-release-notes.XXXXXX")"
          printf '%s\n' \
            "Experimental owner-pilot binaries for $GITHUB_REF_NAME." \
            "" \
            "Generate fresh configs locally with \`./maverick gen-config\`; the archives contain no shared credentials." \
            "Maverick is experimental prerelease software provided without warranty. Read STATUS.md and SECURITY.md before use." \
            >"$notes_file"
          chmod 0444 "$notes_file"
          {
            echo "staging=$staging"
            echo "linux_name=$linux_name"
            echo "linux_sha=$linux_sha"
            echo "linux_checksum_sha=$linux_checksum_sha"
            echo "mac_name=$mac_name"
            echo "mac_sha=$mac_sha"
            echo "mac_checksum_sha=$mac_checksum_sha"
            echo "notes_file=$notes_file"
          } >>"$GITHUB_OUTPUT"
      - name: Recheck remote gates and publish the reverified prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING: ${{ steps.reverified.outputs.staging }}
          LINUX_NAME: ${{ steps.reverified.outputs.linux_name }}
          LINUX_SHA: ${{ steps.reverified.outputs.linux_sha }}
          LINUX_CHECKSUM_SHA: ${{ steps.reverified.outputs.linux_checksum_sha }}
          MAC_NAME: ${{ steps.reverified.outputs.mac_name }}
          MAC_SHA: ${{ steps.reverified.outputs.mac_sha }}
          MAC_CHECKSUM_SHA: ${{ steps.reverified.outputs.mac_checksum_sha }}
          NOTES_FILE: ${{ steps.reverified.outputs.notes_file }}
        run: |
          version="$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)"
          expected_files="$(
            printf '%s\n' \
              "$LINUX_NAME" "$LINUX_NAME.sha256" \
              "$MAC_NAME" "$MAC_NAME.sha256" |
              LC_ALL=C sort
          )"
          actual_files="$(
            cd "$STAGING"
            find . -mindepth 1 -maxdepth 1 -type f ! -type l -print |
              sed 's#^\./##' |
              LC_ALL=C sort
          )"
          test "$actual_files" = "$expected_files"
          test "$(find "$STAGING" -mindepth 1 -maxdepth 1 -print | wc -l)" -eq 4
          test "$(sha256sum "$STAGING/$LINUX_NAME" | awk '{print $1}')" = "$LINUX_SHA"
          test "$(sha256sum "$STAGING/$LINUX_NAME.sha256" | awk '{print $1}')" = "$LINUX_CHECKSUM_SHA"
          test "$(sha256sum "$STAGING/$MAC_NAME" | awk '{print $1}')" = "$MAC_SHA"
          test "$(sha256sum "$STAGING/$MAC_NAME.sha256" | awk '{print $1}')" = "$MAC_CHECKSUM_SHA"
          printf '%s  %s\n' "$LINUX_SHA" "$LINUX_NAME" |
            cmp -s - "$STAGING/$LINUX_NAME.sha256"
          printf '%s  %s\n' "$MAC_SHA" "$MAC_NAME" |
            cmp -s - "$STAGING/$MAC_NAME.sha256"
          git fetch --no-tags --force --atomic origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          ./scripts/verify-release-tag.sh \
            --tag "$GITHUB_REF_NAME" \
            --sha "$GITHUB_SHA" \
            --version "$version" \
            --main-ref origin/main
          exec gh release create "$GITHUB_REF_NAME" \
            "$STAGING/$LINUX_NAME" \
            "$STAGING/$LINUX_NAME.sha256" \
            "$STAGING/$MAC_NAME" \
            "$STAGING/$MAC_NAME.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --latest=false \
            --title "Maverick $GITHUB_REF_NAME" \
            --notes-file "$NOTES_FILE"
