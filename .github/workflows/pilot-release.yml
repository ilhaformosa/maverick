name: pilot-release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: pilot-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify the current remote tag and current main
        run: |
          version="$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)"
          git fetch --no-tags --force --atomic origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          ./scripts/verify-release-tag.sh \
            --tag "$GITHUB_REF_NAME" \
            --sha "$GITHUB_SHA" \
            --version "$version" \
            --main-ref origin/main
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y binutils clang cmake file ripgrep shellcheck
      - run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: Fetch both release-target dependency closures
        run: |
          cargo fetch --locked --target x86_64-unknown-linux-gnu
          cargo fetch --locked --target aarch64-apple-darwin
      - name: Verify target-aware CycloneDX SBOM gates
        run: ./scripts/test-cyclonedx-sbom.sh
      - name: Verify local product gates
        run: ./scripts/local-harness.sh

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.1
      - run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: Fetch the exact release-target dependency closure
        run: cargo fetch --locked --target "${{ matrix.target }}"
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y binutils clang cmake file ripgrep
      - name: Build shareable pilot archive
        env:
          MAVERICK_PILOT_TARGET: ${{ matrix.target }}
        run: |
          version="$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)"
          archive="dist/maverick-${version}-pilot-${MAVERICK_PILOT_TARGET}.tar.gz"
          ./scripts/build-pilot.sh
          ./scripts/verify-pilot-artifact.sh \
            --archive "$archive" \
            --expected-version "$version" \
            --expected-revision "$GITHUB_SHA" \
            --expected-target "$MAVERICK_PILOT_TARGET" \
            --verification-level native
          sbom="dist/maverick-${version}-pilot-${MAVERICK_PILOT_TARGET}.cdx.json"
          ./scripts/generate-cyclonedx-sbom.sh \
            --expected-version "$version" \
            --expected-revision "$GITHUB_SHA" \
            --target "$MAVERICK_PILOT_TARGET" \
            --output "$sbom"
          ./scripts/verify-cyclonedx-sbom.sh \
            --sbom "$sbom" \
            --expected-version "$version" \
            --expected-revision "$GITHUB_SHA" \
            --expected-target "$MAVERICK_PILOT_TARGET" \
            --verification-level full \
            --source-root .
      - name: Reverify the exact files approved for upload
        id: reverified
        env:
          MAVERICK_PILOT_TARGET: ${{ matrix.target }}
        run: |
          version="$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)"
          archive_name="maverick-${version}-pilot-${MAVERICK_PILOT_TARGET}.tar.gz"
          sbom_name="maverick-${version}-pilot-${MAVERICK_PILOT_TARGET}.cdx.json"
          staging="$(mktemp -d "$RUNNER_TEMP/maverick-verified.XXXXXX")"
          chmod 700 "$staging"
          cp "dist/$archive_name" "$staging/$archive_name"
          cp "dist/$archive_name.sha256" "$staging/$archive_name.sha256"
          cp "dist/$sbom_name" "$staging/$sbom_name"
          chmod 0444 \
            "$staging/$archive_name" \
            "$staging/$archive_name.sha256" \
            "$staging/$sbom_name"
          test "$(find "$staging" -mindepth 1 -maxdepth 1 -type f ! -type l -print | wc -l)" -eq 3
          test "$(find "$staging" -mindepth 1 -maxdepth 1 -print | wc -l)" -eq 3
          ./scripts/verify-pilot-artifact.sh \
            --archive "$staging/$archive_name" \
            --expected-version "$version" \
            --expected-revision "$GITHUB_SHA" \
            --expected-target "$MAVERICK_PILOT_TARGET" \
            --verification-level static
          ./scripts/verify-cyclonedx-sbom.sh \
            --sbom "$staging/$sbom_name" \
            --expected-version "$version" \
            --expected-revision "$GITHUB_SHA" \
            --expected-target "$MAVERICK_PILOT_TARGET" \
            --verification-level structural \
            --source-root .
          chmod 0555 "$staging"
          {
            echo "archive=$staging/$archive_name"
            echo "checksum=$staging/$archive_name.sha256"
            echo "sbom=$staging/$sbom_name"
          } >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pilot-${{ matrix.target }}
          path: |
            ${{ steps.reverified.outputs.archive }}
            ${{ steps.reverified.outputs.checksum }}
            ${{ steps.reverified.outputs.sbom }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pilot-x86_64-unknown-linux-gnu
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pilot-aarch64-apple-darwin
          path: dist
      - name: Statically reverify the exact six files selected for publication
        id: reverified
        run: |
          version="$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)"
          linux_name="maverick-${version}-pilot-x86_64-unknown-linux-gnu.tar.gz"
          linux_sbom_name="maverick-${version}-pilot-x86_64-unknown-linux-gnu.cdx.json"
          mac_name="maverick-${version}-pilot-aarch64-apple-darwin.tar.gz"
          mac_sbom_name="maverick-${version}-pilot-aarch64-apple-darwin.cdx.json"
          snapshot_release_note() {
            local source_path="$1"
            local expected_version="$2"
            local snapshot_path="$3"
            local snapshot_parent
            [[ "$source_path" == "docs/releases/v${expected_version}.md" ]] ||
              return 1
            [[ -d docs && ! -L docs ]] || return 1
            [[ -d docs/releases && ! -L docs/releases ]] || return 1
            [[ -f "$source_path" && ! -L "$source_path" ]] || return 1
            snapshot_parent="${snapshot_path%/*}"
            [[ "$snapshot_parent" != "$snapshot_path" ]] || return 1
            [[ -d "$snapshot_parent" && ! -L "$snapshot_parent" ]] || return 1
            [[ ! -e "$snapshot_path" && ! -L "$snapshot_path" ]] || return 1
            cp "$source_path" "$snapshot_path" >/dev/null 2>&1 || return 1
            [[ -f "$snapshot_path" && ! -L "$snapshot_path" ]]
          }
          verify_release_note() {
            local note_path="$1"
            local expected_version="$2"
            local note_bytes
            local privacy_pattern
            local privacy_status=0
            [[ -f "$note_path" && ! -L "$note_path" ]] || return 1
            note_bytes="$(
              wc -c <"$note_path" 2>/dev/null | tr -d '[:space:]'
            )" || return 1
            [[ "$note_bytes" =~ ^[0-9]+$ ]] || return 1
            [[ "$note_bytes" -gt 0 && "$note_bytes" -le 65536 ]] || return 1
            [[ "$(
              grep -Fxc "# Maverick v$expected_version" "$note_path" 2>/dev/null
            )" -eq 1 ]] ||
              return 1
            od -An -tu1 -v "$note_path" 2>/dev/null |
              awk '{
                for (i = 1; i <= NF; i++) {
                  if (($i < 32 && $i != 10) || $i == 127) exit 1
                }
              }' || return 1
            privacy_pattern='/U''sers/[^/[:space:]]+|/ho''me/[^/[:space:]]+|fi''le://([^/[:space:]]+/[^[:space:]]*|[^/[:space:]]+$|/+[^/[:space:]]+/[^[:space:]]+)|ssh''-rsa|BE''GIN (RSA |EC |OPENSSH )?PRI''VATE KEY|mv''1_[A-Za-z0-9_-]{43,}|gh[pousr]_[A-Za-z0-9_]{20,}|sk-(proj-|svcacct-)?[A-Za-z0-9_-]{40,}|dop_v1_[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|Bearer[[:space:]]+[A-Za-z0-9._-]{20,}|OPENAI_''API_KEY|DIGITALOCEAN_''API_TOKEN|AWS_SECRET_''ACCESS_KEY'
            grep -E -i -q "$privacy_pattern" "$note_path" 2>/dev/null ||
              privacy_status=$?
            [[ "$privacy_status" -eq 1 ]]
          }
          release_note_sha256() {
            local note_path="$1"
            local digest
            [[ -f "$note_path" && ! -L "$note_path" ]] || return 1
            if command -v sha256sum >/dev/null 2>&1; then
              digest="$(
                sha256sum "$note_path" 2>/dev/null | awk '{print $1}'
              )" || return 1
            elif command -v shasum >/dev/null 2>&1; then
              digest="$(
                shasum -a 256 "$note_path" 2>/dev/null | awk '{print $1}'
              )" || return 1
            else
              return 1
            fi
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || return 1
            printf '%s\n' "$digest"
          }
          notes_source="docs/releases/v${version}.md"
          notes_dir="$(
            mktemp -d "$RUNNER_TEMP/maverick-release-notes.XXXXXX" 2>/dev/null
          )" || {
            echo "release note verification failed" >&2
            exit 1
          }
          if ! chmod 0700 "$notes_dir" >/dev/null 2>&1; then
            echo "release note verification failed" >&2
            exit 1
          fi
          notes_file="$notes_dir/release-notes.md"
          if ! snapshot_release_note "$notes_source" "$version" "$notes_file"; then
            echo "release note verification failed" >&2
            exit 1
          fi
          if ! chmod 0444 "$notes_file" >/dev/null 2>&1; then
            echo "release note verification failed" >&2
            exit 1
          fi
          if ! verify_release_note "$notes_file" "$version"; then
            echo "release note verification failed" >&2
            exit 1
          fi
          notes_sha="$(release_note_sha256 "$notes_file")" || {
            echo "release note verification failed" >&2
            exit 1
          }
          expected_files="$(
            printf '%s\n' \
              "$linux_name" "$linux_name.sha256" "$linux_sbom_name" \
              "$mac_name" "$mac_name.sha256" "$mac_sbom_name" |
              LC_ALL=C sort
          )"
          actual_files="$(
            find dist -mindepth 1 -maxdepth 1 -type f ! -type l -print |
              sed 's#^dist/##' |
              LC_ALL=C sort
          )"
          test "$actual_files" = "$expected_files"
          test "$(find dist -mindepth 1 -maxdepth 1 -print | wc -l)" -eq 6
          staging="$(mktemp -d "$RUNNER_TEMP/maverick-publish.XXXXXX")"
          chmod 700 "$staging"
          for name in \
            "$linux_name" "$linux_name.sha256" "$linux_sbom_name" \
            "$mac_name" "$mac_name.sha256" "$mac_sbom_name"; do
            cp "dist/$name" "$staging/$name"
            chmod 0444 "$staging/$name"
          done
          ./scripts/verify-pilot-artifact.sh \
            --archive "$staging/$linux_name" \
            --expected-version "$version" \
            --expected-revision "$GITHUB_SHA" \
            --expected-target x86_64-unknown-linux-gnu \
            --verification-level static
          ./scripts/verify-pilot-artifact.sh \
            --archive "$staging/$mac_name" \
            --expected-version "$version" \
            --expected-revision "$GITHUB_SHA" \
            --expected-target aarch64-apple-darwin \
            --verification-level static
          ./scripts/verify-cyclonedx-sbom.sh \
            --sbom "$staging/$linux_sbom_name" \
            --expected-version "$version" \
            --expected-revision "$GITHUB_SHA" \
            --expected-target x86_64-unknown-linux-gnu \
            --verification-level structural \
            --source-root .
          ./scripts/verify-cyclonedx-sbom.sh \
            --sbom "$staging/$mac_sbom_name" \
            --expected-version "$version" \
            --expected-revision "$GITHUB_SHA" \
            --expected-target aarch64-apple-darwin \
            --verification-level structural \
            --source-root .
          linux_sha="$(sha256sum "$staging/$linux_name" | awk '{print $1}')"
          linux_checksum_sha="$(sha256sum "$staging/$linux_name.sha256" | awk '{print $1}')"
          linux_sbom_sha="$(sha256sum "$staging/$linux_sbom_name" | awk '{print $1}')"
          mac_sha="$(sha256sum "$staging/$mac_name" | awk '{print $1}')"
          mac_checksum_sha="$(sha256sum "$staging/$mac_name.sha256" | awk '{print $1}')"
          mac_sbom_sha="$(sha256sum "$staging/$mac_sbom_name" | awk '{print $1}')"
          chmod 0555 "$staging"
          {
            echo "staging=$staging"
            echo "linux_name=$linux_name"
            echo "linux_sha=$linux_sha"
            echo "linux_checksum_sha=$linux_checksum_sha"
            echo "linux_sbom_name=$linux_sbom_name"
            echo "linux_sbom_sha=$linux_sbom_sha"
            echo "mac_name=$mac_name"
            echo "mac_sha=$mac_sha"
            echo "mac_checksum_sha=$mac_checksum_sha"
            echo "mac_sbom_name=$mac_sbom_name"
            echo "mac_sbom_sha=$mac_sbom_sha"
            echo "notes_file=$notes_file"
            echo "notes_sha=$notes_sha"
          } >>"$GITHUB_OUTPUT"
      - name: Recheck remote gates and publish the reverified prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING: ${{ steps.reverified.outputs.staging }}
          LINUX_NAME: ${{ steps.reverified.outputs.linux_name }}
          LINUX_SHA: ${{ steps.reverified.outputs.linux_sha }}
          LINUX_CHECKSUM_SHA: ${{ steps.reverified.outputs.linux_checksum_sha }}
          LINUX_SBOM_NAME: ${{ steps.reverified.outputs.linux_sbom_name }}
          LINUX_SBOM_SHA: ${{ steps.reverified.outputs.linux_sbom_sha }}
          MAC_NAME: ${{ steps.reverified.outputs.mac_name }}
          MAC_SHA: ${{ steps.reverified.outputs.mac_sha }}
          MAC_CHECKSUM_SHA: ${{ steps.reverified.outputs.mac_checksum_sha }}
          MAC_SBOM_NAME: ${{ steps.reverified.outputs.mac_sbom_name }}
          MAC_SBOM_SHA: ${{ steps.reverified.outputs.mac_sbom_sha }}
          NOTES_FILE: ${{ steps.reverified.outputs.notes_file }}
          NOTES_SHA: ${{ steps.reverified.outputs.notes_sha }}
        run: |
          release_note_digest_matches() {
            local note_path="$1"
            local expected_sha="$2"
            local actual_sha
            [[ -f "$note_path" && ! -L "$note_path" ]] || return 1
            [[ "$expected_sha" =~ ^[0-9a-f]{64}$ ]] || return 1
            if command -v sha256sum >/dev/null 2>&1; then
              actual_sha="$(
                sha256sum "$note_path" 2>/dev/null | awk '{print $1}'
              )" || return 1
            elif command -v shasum >/dev/null 2>&1; then
              actual_sha="$(
                shasum -a 256 "$note_path" 2>/dev/null | awk '{print $1}'
              )" || return 1
            else
              return 1
            fi
            [[ "$actual_sha" =~ ^[0-9a-f]{64}$ ]] || return 1
            [[ "$actual_sha" == "$expected_sha" ]]
          }
          version="$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)"
          expected_files="$(
            printf '%s\n' \
              "$LINUX_NAME" "$LINUX_NAME.sha256" "$LINUX_SBOM_NAME" \
              "$MAC_NAME" "$MAC_NAME.sha256" "$MAC_SBOM_NAME" |
              LC_ALL=C sort
          )"
          actual_files="$(
            cd "$STAGING"
            find . -mindepth 1 -maxdepth 1 -type f ! -type l -print |
              sed 's#^\./##' |
              LC_ALL=C sort
          )"
          test "$actual_files" = "$expected_files"
          test "$(find "$STAGING" -mindepth 1 -maxdepth 1 -print | wc -l)" -eq 6
          test "$(sha256sum "$STAGING/$LINUX_NAME" | awk '{print $1}')" = "$LINUX_SHA"
          test "$(sha256sum "$STAGING/$LINUX_NAME.sha256" | awk '{print $1}')" = "$LINUX_CHECKSUM_SHA"
          test "$(sha256sum "$STAGING/$LINUX_SBOM_NAME" | awk '{print $1}')" = "$LINUX_SBOM_SHA"
          test "$(sha256sum "$STAGING/$MAC_NAME" | awk '{print $1}')" = "$MAC_SHA"
          test "$(sha256sum "$STAGING/$MAC_NAME.sha256" | awk '{print $1}')" = "$MAC_CHECKSUM_SHA"
          test "$(sha256sum "$STAGING/$MAC_SBOM_NAME" | awk '{print $1}')" = "$MAC_SBOM_SHA"
          printf '%s  %s\n' "$LINUX_SHA" "$LINUX_NAME" |
            cmp -s - "$STAGING/$LINUX_NAME.sha256"
          printf '%s  %s\n' "$MAC_SHA" "$MAC_NAME" |
            cmp -s - "$STAGING/$MAC_NAME.sha256"
          git fetch --no-tags --force --atomic origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          ./scripts/verify-release-tag.sh \
            --tag "$GITHUB_REF_NAME" \
            --sha "$GITHUB_SHA" \
            --version "$version" \
            --main-ref origin/main
          if ! release_note_digest_matches "$NOTES_FILE" "$NOTES_SHA"; then
            echo "release note verification failed" >&2
            exit 1
          fi
          exec gh release create "$GITHUB_REF_NAME" \
            "$STAGING/$LINUX_NAME" \
            "$STAGING/$LINUX_NAME.sha256" \
            "$STAGING/$LINUX_SBOM_NAME" \
            "$STAGING/$MAC_NAME" \
            "$STAGING/$MAC_NAME.sha256" \
            "$STAGING/$MAC_SBOM_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --latest=false \
            --title "Maverick $GITHUB_REF_NAME" \
            --notes-file "$NOTES_FILE"
