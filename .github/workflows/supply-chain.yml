name: supply-chain

on:
  pull_request:
    paths:
      - ".cargo/**"
      - ".github/workflows/supply-chain.yml"
      - ".github/workflows/pilot-release.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**/Cargo.toml"
      - "crates/maverick-tests/fixtures/quiche-tls-auth/Cargo.lock"
      - "deny.toml"
      - "rust-toolchain.toml"
      - "scripts/generate-cyclonedx-sbom.sh"
      - "scripts/install-security-tools.sh"
      - "scripts/security-dependency-inventory.sh"
      - "scripts/test-cyclonedx-sbom.sh"
      - "scripts/test-install-security-tools.sh"
      - "scripts/verify-cyclonedx-sbom.sh"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - name: Identify security-tool cache compatibility
        id: tool-environment
        run: |
          set -euo pipefail
          echo "rust=$(rustc -vV | sha256sum | cut -d ' ' -f 1)" >>"$GITHUB_OUTPUT"
          echo "os=$(sha256sum /etc/os-release | cut -d ' ' -f 1)" >>"$GITHUB_OUTPUT"
      - name: Restore pinned security tools
        id: security-tools-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-cyclonedx
          # No prefix fallback: binaries must match OS, architecture, compiler,
          # and the install script containing the exact tool-version pins.
          key: security-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.tool-environment.outputs.os }}-${{ steps.tool-environment.outputs.rust }}-${{ hashFiles('scripts/install-security-tools.sh') }}
      - name: Install ripgrep if missing
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi
      - name: Test pinned tool installation decisions
        run: ./scripts/test-install-security-tools.sh
      - name: Install missing or mismatched security tools
        run: ./scripts/install-security-tools.sh
      - name: Fetch both release-target dependency closures
        run: |
          cargo fetch --locked --target x86_64-unknown-linux-gnu
          cargo fetch --locked --target aarch64-apple-darwin
      - run: ./scripts/security-dependency-inventory.sh
      - name: Generate and verify target-aware development SBOMs
        run: ./scripts/test-cyclonedx-sbom.sh
      - name: Save verified main security tools
        if: github.ref == 'refs/heads/main' && steps.security-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-cyclonedx
          key: ${{ steps.security-tools-cache.outputs.cache-primary-key }}
      - name: Record security-tool cache result
        if: always()
        env:
          CACHE_HIT: ${{ steps.security-tools-cache.outputs.cache-hit }}
        run: |
          printf 'Pinned security-tool cache exact hit: `%s`\n' \
            "${CACHE_HIT:-unavailable}" >>"$GITHUB_STEP_SUMMARY"
