name: t019d-linux-published-release-drill

on:
  pull_request:
    branches:
      - main
    types:
      - opened

permissions:
  contents: read

jobs:
  published-linux-upgrade-rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MAVERICK_EXPECTED_HEAD_REPOSITORY: ilhaformosa/maverick
      MAVERICK_EXPECTED_HEAD_REF: codex/t019d-linux-release-upgrade-rollback-drill
      MAVERICK_EXPECTED_BASE_SHA: c069b4a9a0eb59184d7cb4deb966ce66793ebd3c
      MAVERICK_EVENT_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      MAVERICK_EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      MAVERICK_EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      MAVERICK_EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
      MAVERICK_EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      MAVERICK_EVENT_DRAFT_STATE: ${{ github.event.pull_request.draft }}
      MAVERICK_EVENT_RUN_ATTEMPT: ${{ github.run_attempt }}
      MAVERICK_RELEASE_BASE_URL: https://github.com/ilhaformosa/maverick/releases/download
    steps:
      - name: Verify the one-time pull request event
        run: |
          set -euo pipefail
          reject_event() {
            echo "one-time pull request event rejected" >&2
            exit 1
          }
          [[ "$MAVERICK_EVENT_DRAFT_STATE" == "true" ]] || reject_event
          [[ "$MAVERICK_EVENT_RUN_ATTEMPT" == "1" ]] || reject_event
          [[ "$MAVERICK_EVENT_HEAD_REPOSITORY" == \
            "$MAVERICK_EXPECTED_HEAD_REPOSITORY" ]] || reject_event
          [[ "$MAVERICK_EVENT_HEAD_REF" == "$MAVERICK_EXPECTED_HEAD_REF" ]] || \
            reject_event
          [[ "$MAVERICK_EVENT_BASE_REF" == "main" ]] || reject_event
          [[ "$MAVERICK_EVENT_BASE_SHA" == "$MAVERICK_EXPECTED_BASE_SHA" ]] || \
            reject_event
          [[ "$MAVERICK_EVENT_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || reject_event
          echo "one-time pull request event OK"
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify the checked-out pull request identity
        run: |
          set -euo pipefail
          reject_identity() {
            echo "one-time pull request identity rejected" >&2
            exit 1
          }
          checked_out_sha="$(git rev-parse HEAD 2>/dev/null)" || reject_identity
          [[ "$checked_out_sha" == "$MAVERICK_EVENT_HEAD_SHA" ]] || \
            reject_identity

          remote_line="$(git ls-remote --exit-code origin \
            "refs/heads/$MAVERICK_EXPECTED_HEAD_REF" 2>/dev/null)" || \
            reject_identity
          [[ "$(printf '%s\n' "$remote_line" | wc -l | tr -d '[:space:]')" == \
            "1" ]] || reject_identity
          remote_sha="${remote_line%%[[:space:]]*}"
          [[ "$remote_sha" == "$MAVERICK_EVENT_HEAD_SHA" ]] || reject_identity

          remote_main_line="$(git ls-remote --exit-code origin \
            refs/heads/main 2>/dev/null)" || reject_identity
          [[ "$(printf '%s\n' "$remote_main_line" | wc -l | tr -d '[:space:]')" == \
            "1" ]] || reject_identity
          remote_main_sha="${remote_main_line%%[[:space:]]*}"
          [[ "$remote_main_sha" == "$MAVERICK_EXPECTED_BASE_SHA" ]] || \
            reject_identity
          echo "one-time pull request identity OK"
      - name: Verify the native GNU/Linux release lifecycle
        run: |
          set -euo pipefail
          for tool in \
            awk cmp curl dd file find grep gzip head od perl readelf sed \
            sha256sum stat strings tar tr wc; do
            command -v "$tool" >/dev/null 2>&1
          done
          tar --version | grep -Fq "GNU tar"

          assets_dir="$(mktemp -d "$RUNNER_TEMP/maverick-published-drill.XXXXXX")"
          chmod 0700 "$assets_dir"
          cleanup() {
            case "$assets_dir" in
              "$RUNNER_TEMP"/maverick-published-drill.*)
                find "$assets_dir" -depth -delete >/dev/null 2>&1 || true
                ;;
            esac
          }
          trap cleanup EXIT

          beta1_name="maverick-1.2.0-beta.1-pilot-x86_64-unknown-linux-gnu.tar.gz"
          beta2_name="maverick-1.2.0-beta.2-pilot-x86_64-unknown-linux-gnu.tar.gz"
          download_asset() {
            local tag="$1"
            local name="$2"
            curl --fail --silent --show-error --location \
              --proto '=https' --tlsv1.2 \
              --connect-timeout 15 --max-time 120 \
              --retry 3 --retry-max-time 180 --max-filesize 67108864 \
              --output "$assets_dir/$name" \
              "$MAVERICK_RELEASE_BASE_URL/$tag/$name"
          }
          download_asset "v1.2.0-beta.1" "$beta1_name"
          download_asset "v1.2.0-beta.1" "$beta1_name.sha256"
          download_asset "v1.2.0-beta.2" "$beta2_name"
          download_asset "v1.2.0-beta.2" "$beta2_name.sha256"
          chmod 0600 "$assets_dir"/*

          ./scripts/test-n-minus-one-release-drill.sh \
            --target x86_64-unknown-linux-gnu \
            --beta1-archive "$assets_dir/$beta1_name" \
            --beta1-checksum "$assets_dir/$beta1_name.sha256" \
            --beta2-archive "$assets_dir/$beta2_name" \
            --beta2-checksum "$assets_dir/$beta2_name.sha256"
