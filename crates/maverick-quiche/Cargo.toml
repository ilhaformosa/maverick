[package]
name = "maverick-quiche"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
boring.workspace = true
bytes.workspace = true
# Feature unification keeps quiche trace logging out of every product build.
log = { version = "=0.4.35", default-features = false, features = ["max_level_debug"] }
maverick-core = { path = "../maverick-core", features = ["experimental-h3"] }
quiche = { version = "=0.30.1", default-features = false, features = ["boringssl-boring-crate"] }
rand.workspace = true
socket2 = "0.6.5"
tokio.workspace = true
