[package]
name = "maverick-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "maverick-tun-phase2"
path = "src/bin/maverick-tun-phase2.rs"
required-features = ["tun-phase2"]

[[bin]]
name = "quiche-fork-replay-verifier"
path = "src/bin/quiche-fork-replay-verifier.rs"

[features]
default = ["browser-tls"]
browser-tls = ["maverick-client/browser-tls", "maverick-core/browser-tls"]
ech = ["maverick-client/ech", "maverick-server/ech"]
tun-runtime = [
  "dep:etherparse",
  "dep:maverick-tun",
  "maverick-client/tun-runtime",
]
tun-phase2 = ["tun-runtime", "dep:clap", "dep:libc"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
bytes.workspace = true
clap = { workspace = true, optional = true }
etherparse = { version = "=0.20.3", optional = true }
futures.workspace = true
h2.workspace = true
http.workspace = true
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
maverick-client = { path = "../maverick-client", default-features = false }
maverick-core = { path = "../maverick-core", default-features = false }
maverick-server = { path = "../maverick-server" }
maverick-tun = { path = "../maverick-tun", optional = true }
rcgen.workspace = true
rustls.workspace = true
rustix = { version = "=1.1.4", features = ["fs", "process"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
signal-hook = { version = "=0.4.4", default-features = false }
tempfile.workspace = true
time.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true, optional = true }
