[package]
name = "maverick-quiche-tls-auth"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace]

[features]
default = []
proxy = ["dep:bytes", "dep:tokio", "dep:maverick-client", "dep:maverick-server", "maverick-core/experimental-h3"]

[dependencies]
anyhow = "1"
boring = "=5.2.0"
brotli = "8.0"
log = { version = "=0.4.33", default-features = false, features = ["max_level_debug"] }
maverick-core = { path = "../../../maverick-core", default-features = false }
quiche = { version = "=0.30.0", default-features = false, features = ["boringssl-boring-crate"] }
rcgen = "0.13"
sha2 = "0.10"
tempfile = "3"
bytes = { version = "1", optional = true }
tokio = { version = "1.53.3", features = ["full"], optional = true }
maverick-client = { path = "../../../maverick-client", default-features = false, features = ["browser-tls", "experimental-h3"], optional = true }
maverick-server = { path = "../../../maverick-server", features = ["experimental-h3"], optional = true }

[lib]
test = false

[[bin]]
name = "h3-proxy-smoke"
path = "src/main.rs"
required-features = ["proxy"]

[[test]]
name = "proxy"
path = "tests/proxy.rs"
required-features = ["proxy"]

[[test]]
name = "tls_auth"
path = "tests/tls_auth.rs"

[[test]]
name = "upstream_behavior"
path = "../../tests/quiche_candidate.rs"

[[test]]
name = "proxy_logging"
path = "tests/proxy_logging.rs"
required-features = ["proxy"]
