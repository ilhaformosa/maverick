[package]
edition = "2021"
rust-version = "1.88"
name = "quiche"
version = "0.29.3"
authors = ["Alessandro Ghedini <alessandro@ghedini.me>"]
build = "src/build.rs"
description = "Savoury implementation of the QUIC transport protocol and HTTP/3"
license = "BSD-2-Clause"
repository = "https://github.com/cloudflare/quiche"

[features]
default = ["boringssl-boring-crate"]
boringssl-boring-crate = ["boring", "foreign-types-shared"]
internal = []

[lib]
name = "quiche"
crate-type = ["lib", "staticlib", "cdylib"]
path = "src/lib.rs"

[dependencies.boring]
version = "4.3"
optional = true

[dependencies.bytes]
version = "1.11.1"

[dependencies.debug_panic]
version = "0.2.1"

[dependencies.either]
version = "1.8"
default-features = false

[dependencies.enum_dispatch]
version = "0.3"

[dependencies.foreign-types-shared]
version = "0.3.0"
optional = true

[dependencies.intrusive-collections]
version = "0.9.5"

[dependencies.libc]
version = "0.2.76"
default-features = false

[dependencies.libm]
version = "0.2"

[dependencies.log]
version = "0.4.20"
features = ["std"]

[dependencies.octets]
version = "0.3.6"
features = ["huffman_hpack"]

[dependencies.slab]
version = "0.4"

[dependencies.smallvec]
version = "1.10"
features = ["union"]
default-features = false

[target."cfg(windows)".dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Networking_WinSock",
    "Win32_Security_Cryptography",
]

[lints.clippy]
mem_forget = "deny"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(capture_keylogs)",
    "cfg(test_invalid_len_compilation_fail)",
    "cfg(feature, values(\"custom-client-dcid\", \"ffi\", \"fuzzing\", \"gcongestion\", \"pkg-config-meta\", \"qlog\", \"sfv\"))",
]
